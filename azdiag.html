<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A-Z Messung</title>
<style>
 :root{--bg:#0e131a;--txt:#e9e6df;--muted:#8b95a2;--rule:#243040}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,system-ui,sans-serif}
 #werte{position:fixed;left:0;right:0;top:0;z-index:50;background:#0a0e13;border-bottom:1px solid var(--rule);
   padding:10px 12px calc(10px);font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
 #werte b{color:#e0b354}
 #liste{padding:200px 14px 140px}
 .k{border:1px solid var(--rule);border-radius:12px;padding:16px;margin:0 0 10px;height:120px}
 .azbar{position:fixed;right:1px;top:220px;bottom:60px;z-index:40;display:flex;flex-direction:column;
   justify-content:center;gap:1px;width:19px;padding:5px 0;border-radius:10px;
   background:rgba(20,26,34,.72);touch-action:none;user-select:none;-webkit-user-select:none}
 .azbar b{flex:1 1 0;min-height:14px;max-height:34px;display:flex;align-items:center;justify-content:center;
   font:600 9.5px/1 ui-monospace,monospace;color:var(--muted)}
 .azbar.aktiv{background:rgba(28,38,50,.92)} .azbar.aktiv b{color:var(--txt)}
</style></head><body>
<div id="werte">bereit — Finger auf die Leiste rechts legen und langsam ziehen</div>
<div id="liste"></div>
<script>
const L=document.getElementById('liste'), W=document.getElementById('werte');
const B='ABCDFHILMNOPRSTUVX'.split('');
B.forEach(c=>{ for(let i=0;i<3;i++){ const d=document.createElement('div'); d.className='k';
  d.dataset.init=c; d.textContent=c+' — Karte '+(i+1); L.appendChild(d); } });
const bar=document.createElement('div'); bar.className='azbar';
bar.innerHTML=B.map(c=>'<b data-c="'+c+'">'+c+'</b>').join('');
document.body.appendChild(bar);
let mo=0,mu=1,n=B.length,anker=[],fAkt=0,letztY=0,an=false,pid=null,ereignisse=0,ups=0,starts=0;
function messen(){
  const k=[...bar.children];
  const a=k[0].getBoundingClientRect(), z=k[n-1].getBoundingClientRect();
  mo=a.top+a.height/2; mu=z.top+z.height/2;
  const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
  anker=B.map(c=>{ const e=L.querySelector('[data-init="'+c+'"]');
    return e?Math.max(0,Math.min(max,e.getBoundingClientRect().top+window.scrollY-210)):0; });
}
function zeig(extra){
  const vv=window.visualViewport;
  W.innerHTML='innerHeight <b>'+innerHeight+'</b>  dpr <b>'+devicePixelRatio+'</b>\n'
   +'visualViewport h <b>'+(vv?Math.round(vv.height):'-')+'</b>  offsetTop <b>'+(vv?Math.round(vv.offsetTop):'-')+'</b>  scale <b>'+(vv?vv.scale:'-')+'</b>\n'
   +'Leiste  mo <b>'+mo.toFixed(1)+'</b>  mu <b>'+mu.toFixed(1)+'</b>  Spanne <b>'+(mu-mo).toFixed(1)+'</b>\n'
   +'Anker   erster <b>'+Math.round(anker[0])+'</b>  letzter <b>'+Math.round(anker[n-1])+'</b>\n'
   +(extra||'')
   +'\nstarts <b>'+starts+'</b>  moves <b>'+ereignisse+'</b>  ups <b>'+ups+'</b>  an=<b>'+an+'</b>';
}
messen(); zeig('');
bar.addEventListener('pointerdown',e=>{
  starts++; if(an){/* uebernehmen */} an=true; pid=e.pointerId; bar.classList.add('aktiv');
  try{bar.setPointerCapture(e.pointerId);}catch(_){}
  messen();
  fAkt=(Math.max(mo,Math.min(e.clientY,mu))-mo)/(mu-mo)*(n-1); letztY=e.clientY;
  zeig('START   clientY <b>'+e.clientY.toFixed(1)+'</b>  fAkt <b>'+fAkt.toFixed(2)+'</b>  Buchstabe <b>'+B[Math.round(fAkt)]+'</b>\n');
});
bar.addEventListener('pointermove',e=>{
  if(!an||e.pointerId!==pid) return; e.preventDefault(); ereignisse++;
  const d=e.clientY-letztY;
  fAkt=Math.max(0,Math.min(n-1,fAkt+d*(n-1)/(mu-mo))); letztY=e.clientY;
  const i=Math.max(0,Math.min(n-1,Math.round(fAkt)));
  window.scrollTo(0,anker[i]);
  zeig('ZIEHEN  clientY <b>'+e.clientY.toFixed(1)+'</b>  delta <b>'+d.toFixed(1)+'</b>\n'
      +'        fAkt <b>'+fAkt.toFixed(2)+'</b>  Buchstabe <b>'+B[i]+'</b>  scrollY <b>'+Math.round(scrollY)+'</b>\n');
});
const ende=e=>{ if(!an)return; ups++; an=false;
  try{if(pid!=null)bar.releasePointerCapture(pid);}catch(_){} pid=null;
  bar.classList.remove('aktiv'); zeig('ENDE\n'); };
addEventListener('pointerup',ende); addEventListener('pointercancel',ende);
bar.addEventListener('lostpointercapture',ende);
</script></body></html>
