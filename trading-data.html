/* ---------- Trade-Republic-CSV-Import (Buchungen ergänzen, Steuer/trid nachtragen) ---------- */
let tdPlan=null;
function tdCsvNum(s){ s=String(s==null?"":s).trim().replace(/\s/g,"");
  if(!s)return null;
  if(s.indexOf(",")>=0 && s.indexOf(".")>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>=0) s=s.replace(",",".");
  const n=parseFloat(s); return isNaN(n)?null:n; }
function tdFmt(x){ if(x==null)return ""; let s=(+x).toFixed(10).replace(/0+$/,"").replace(/\.$/,""); return s||"0"; }
function tdNorm(x){ return String(x||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function tdParseCSV(text){
  const rows=[]; let field="",row=[],q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(field);field="";} else if(c==='\r'){} else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";} else field+=c; } }
  if(field.length||row.length){row.push(field);rows.push(row);}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.length>1).map(r=>{const o={};head.forEach((h,k)=>o[h]=(r[k]==null?"":r[k]));return o;}); }
function tdClassify(r){
  const hay=[(r.category||""),(r.type||""),(r.description||"")].join(" ").toUpperCase();
  const shares=tdCsvNum(r.shares), price=tdCsvNum(r.price), amount=tdCsvNum(r.amount);
  // Kapitalmaßnahme (Split, Spin-off, Bonus, Storno): Stückzahl-Änderung OHNE Preis → als Kauf/Verkauf @0,
  // sonst fehlen die Stücke und die Position zeigt eine falsche Anzahl.
  // Jede Kapitalmaßnahme, die STÜCKE bewegt, muss gebucht werden — sonst stimmt die Anzahl nicht.
  // Auch wenn ein Preis dabeisteht: z. B. Bezugsrechte in Aktien tauschen (CALL_ON…), eine
  // Wahldividende in Aktien nehmen (STOCK_DIVIDEND) oder eine Andienung (RIGHTS).
  if(shares && /SPLIT|SPIN.?OFF|BONUS|MERGER|CAPITAL_INCREASE|WORTHLESS|TILG|WARRANT|STOCK.?DIVIDEND|OPTIONAL.?DIVIDEND|INTERMEDIATE.?SECURITIES|CALL_ON|RIGHTS|EXCHANGE/.test(hay))
    return shares>0?"kauf":"verkauf";
  if(/DIVIDEND|DISTRIBUTION|AUSSCHUE?TT/.test(hay)) return amount?"dividende":null;
  if(shares&&price){
    if(amount==null){ if(/SELL|VERKAUF/.test(hay))return"verkauf"; if(/BUY|KAUF|SAVING/.test(hay))return"kauf"; return null; }
    return amount<0?"kauf":"verkauf"; }
  return null; }
function tdBuildPlan(text){
  const rows=tdParseCSV(text);
  const seen=new Set(); let maxDate="";
  for(const p of state.positions) for(const it of (p.tx||[]).concat(p.div||[])){ if(it.trid)seen.add(it.trid); const d=(it.datum||"").slice(0,10); if(d>maxDate)maxDate=d; }
  const knownIsin=new Set(), knownName=new Set(), archivBis={};
  for(const p of state.positions){ if(p.archivBis && p.isin) archivBis[(p.broker||"TR")+"|"+p.isin]=p.archivBis; }
  for(const p of state.positions){ const bk=(p.broker||"TR"); if(p.isin)knownIsin.add(bk+"|"+p.isin); const k=tdNorm(p.titel); if(k)knownName.add(bk+"|"+k); }
  const isinMap=state.settings.isinMap||{};
  // Netto-Stück je Symbol (Kauf +, Verkauf − stehen so in der CSV) → noch gehalten?
  // Knockout/Tilgung koppeln: WARRANT_EXERCISE bucht die Stücke aus, die TILG-Zeile zahlt aus.
  // Rücknahmebetrag je ISIN+Datum sammeln → Kurs = Betrag / Stück (nicht pauschal 0!).
  const redeem={}; for(const r of rows){ if((r.type||"").toUpperCase()==="TILG"){ const k=(r.symbol||"").trim()+"|"+(r.date||"").slice(0,10); redeem[k]=(redeem[k]||0)+(tdCsvNum(r.amount)||0); } }
  // Wahldividende in BAR: der Anspruch wird eingebucht und sofort wieder zurückgegeben.
  // Beide Zeilen überspringen, wenn sie sich ausgleichen — sonst greift FIFO auf die
  // echten Aktien zu und erzeugt einen Scheinverlust, und die Bardividende zählte doppelt.
  const anspruch={};
  for(const r of rows){ const t=(r.type||"").toUpperCase();
    if(/STOCK.?DIVIDEND|OPTIONAL.?DIVIDEND/.test(t)){ const k=(r.symbol||"").trim(); anspruch[k]=(anspruch[k]||0)+(tdCsvNum(r.shares)||0); } }
  // Bezugsrecht ausgeübt: das Geld steht in einer eigenen Zeile (CAPITAL_INC_CASH), die in
  // ihrer Beschreibung die ISIN des RECHTS nennt — die Aktien kommen aber auf der ISIN des
  // Wertpapiers herein. Über das gemeinsame Datum lässt sich beides verbinden und der
  // tatsächlich gezahlte Bezugspreis ausrechnen, statt die Stücke mit 0 € einzubuchen.
  const bezugsGeld={};
  for(const r of rows){ if((r.type||"").toUpperCase()!=="CAPITAL_INC_CASH") continue;
    const m=/ISIN\s+([A-Z0-9]{12})/i.exec(r.description||"");
    const rechte=(m?m[1]:(r.symbol||"")).trim(); const betrag=Math.abs(tdCsvNum(r.amount)||0);
    if(rechte&&betrag) bezugsGeld[rechte]=(bezugsGeld[rechte]||0)+betrag; }
  const bezugsPreis={};   // Datum|ISIN der eingebuchten Aktie → Preis je Stück
  if(Object.keys(bezugsGeld).length){
    const proTag={};
    for(const r of rows){ if(!/CALL_ON/i.test(r.type||"")) continue;
      const d=(r.date||"").slice(0,10); (proTag[d]||(proTag[d]=[])).push(r); }
    for(const d in proTag){
      const raus=proTag[d].filter(r=>(tdCsvNum(r.shares)||0)<0);
      const rein=proTag[d].filter(r=>(tdCsvNum(r.shares)||0)>0);
      let geld=0; for(const r of raus) geld+=bezugsGeld[(r.symbol||"").trim()]||0;
      const stk=rein.reduce((a,r)=>a+(tdCsvNum(r.shares)||0),0);
      if(geld>0&&stk>0) for(const r of rein) bezugsPreis[d+"|"+(r.symbol||"").trim()]=geld/stk;
    }
  }
  const net={}; for(const r of rows){ const isin=(r.symbol||"").trim(); if(!isin)continue; const k=(r.type||"").toUpperCase()==="WARRANT_EXERCISE"?"verkauf":tdClassify(r); if(k==="kauf"||k==="verkauf")net[isin]=(net[isin]||0)+(tdCsvNum(r.shares)||0); }
  const cand=[]; const unknown={}; let skipped=0, noWP=0;
  for(const r of rows){
    const ty=(r.type||"").toUpperCase();
    if(ty==="TILG") continue;   // Auszahlung wird über den zugehörigen WARRANT_EXERCISE verbucht
    if(/STOCK.?DIVIDEND|OPTIONAL.?DIVIDEND/.test(ty) && Math.abs(anspruch[(r.symbol||"").trim()]||0)<1e-4) continue;   // bar gewählt → hebt sich auf
    const dt=(r.date||"").slice(0,10); const isin0=(r.symbol||"").trim();
    let kind, stueck, kurs, frei=false;
    if(ty==="WARRANT_EXERCISE"){
      stueck=Math.abs(tdCsvNum(r.shares)||0); if(!stueck){noWP++;continue;}
      kind="verkauf"; kurs=(redeem[(r.symbol||"").trim()+"|"+dt]||0)/stueck;   // Rücknahmepreis pro Stück
    } else {
      kind=tdClassify(r); if(!kind){noWP++;continue;}
      stueck=Math.abs(tdCsvNum(r.shares)||0); kurs=Math.abs(tdCsvNum(r.price)||0);
      // Zuteilungen ohne Gegenleistung (Wahldividende, Bonusaktien, Split, Bezugsrechte)
      // mit 0 € buchen. Der Preis in der CSV ist dort ein Nennwert, kein Kaufpreis —
      // uebernaehme man ihn, entstuende ein erfundener Gewinn oder Verlust, und die
      // Bardividende waere doppelt gezaehlt. Echte Auszahlungen (Andienung, Tilgung)
      // behalten ihren Preis.
      if(/STOCK.?DIVIDEND|OPTIONAL.?DIVIDEND|BONUS|SPLIT|SPIN.?OFF|INTERMEDIATE.?SECURITIES|CALL_ON|WORTHLESS|MERGER/.test(ty)){
        const bp=bezugsPreis[dt+"|"+isin0];
        if(bp>0){ kurs=bp; }                  // bezahltes Bezugsrecht → echter Einstand
        else { kurs=0; if(tdCsvNum(r.shares)>0) frei=true; }
      }
    }
    const trid=(r.transaction_id||"").trim();
    if(trid && seen.has(trid)){skipped++;continue;}
    const isin=(r.symbol||"").trim(), name=(r.name||"").trim();
    const broker=(String(r.broker||"TR").toUpperCase().trim())||"TR";
    if(archivBis[broker+"|"+isin] && dt<=archivBis[broker+"|"+isin]){ skipped++; continue; }   // liegt im verdichteten Archiv
    const isKnown = knownIsin.has(broker+"|"+isin) || knownName.has(broker+"|"+tdNorm(name)) || !!isinMap[isin];
    if(!isKnown){ if(!unknown[isin])unknown[isin]={isin,name,count:0,last:"",held:(net[isin]||0)>0.0001,broker}; unknown[isin].count++; if(dt>unknown[isin].last)unknown[isin].last=dt; }
    cand.push({ isin, name, kind, trid, datum:dt, broker, stueck, kurs, frei,
      fee:Math.abs(tdCsvNum(r.fee)||0), tax:Math.abs(tdCsvNum(r.tax)||0), amount:Math.abs(tdCsvNum(r.amount)||0) }); }
  // Kontostand: Betrag + Steuer + Gebühr über ALLE Zeilen. Achtung, das Vorzeichen steht
  // in der CSV — Steuer-Erstattungen (Verlustverrechnung) sind positiv und werden gutgeschrieben.
  let saldo=0, zinsen=[], steueropt=[];
  for(const r of rows){
    saldo += (tdCsvNum(r.amount)||0) + (tdCsvNum(r.tax)||0) + (tdCsvNum(r.fee)||0);
    const ty=(r.type||"").toUpperCase();
    if(ty==="INTEREST_PAYMENT"){
      const netto=(tdCsvNum(r.amount)||0)+(tdCsvNum(r.tax)||0);
      if(netto) zinsen.push({datum:(r.date||"").slice(0,10), netto, trid:(r.transaction_id||"").trim()});
    }
    // Steuerbuchungen OHNE Trade-Bezug — laufen alle ueber dieselbe Liste am Verrechnungskonto:
    //   TAX_OPTIMIZATION = spaetere Verlustverrechnung (positiv = Erstattung)
    //   EARNINGS         = Vorabpauschale auf thesaurierende Fonds
    //   TILG             = Steuer auf Tilgung/Rueckzahlung (haengt an der TILG-Zeile, nicht am Trade)
    //   SEC_ACCOUNT      = Korrektur auf Depotebene
    // Ohne diese fehlten 27.08.2026 rund 101 € Steuer im Abgleich gegen die TR-App.
    const STEUERZEILEN={TAX_OPTIMIZATION:"Steueroptimierung", EARNINGS:"Vorabpauschale", TILG:"Tilgung", SEC_ACCOUNT:"Depotkonto"};
    if(STEUERZEILEN[ty]){
      const betrag=tdCsvNum(r.tax)||0;
      if(betrag) steueropt.push({datum:(r.date||"").slice(0,10), betrag, trid:(r.transaction_id||"").trim(), notiz:STEUERZEILEN[ty]});
    }
  }
  return {cand, unknown, skipped, noWP, total:rows.length, maxDate, saldo, zinsen, steueropt}; }
// Kern: einmal simulieren (mutate=false → Vorschau auf Klon) bzw. anwenden (mutate=true → echter Zustand)
function tdSimulate(assign, mutate){
  const positions = mutate ? state.positions : JSON.parse(JSON.stringify(state.positions));
  const isinMap = Object.assign({}, state.settings.isinMap||{}, assign||{});
  const byName={}, byTicker={}, byIsin={};
  for(const p of positions){ const bk=(p.broker||"TR"); const k=tdNorm(p.titel); if(k)byName[bk+"|"+k]=p; if(p.symbol)byTicker[bk+"|"+p.symbol.toUpperCase()]=p; if(p.isin)byIsin[bk+"|"+p.isin]=p; }
  const seen=new Set(), posMaxDate={}; for(const p of positions){ let mx=""; for(const it of (p.tx||[]).concat(p.div||[])){ if(it.trid)seen.add(it.trid); const d=(it.datum||"").slice(0,10); if(d>mx)mx=d; } posMaxDate[p.id]=mx; }
  const isNew={}, used={}, now=Date.now();
  let backfill=0, added=0, skippedSeen=0, skippedBaseline=0, newPos=0, unresolved=0;
  for(const c of tdPlan.cand){
    if(c.trid && seen.has(c.trid)){ skippedSeen++; continue; }
    const bk=(c.broker||"TR");
    const ticker = String(isinMap[c.isin] || (byName[bk+"|"+tdNorm(c.name)]?byName[bk+"|"+tdNorm(c.name)].symbol:"") || (bk!=="TR"?c.isin:"") || "").toUpperCase();
    let p = (bk!=="TR"?null:byIsin[bk+"|"+c.isin]) || (ticker?byTicker[bk+"|"+ticker]:null) || byName[bk+"|"+tdNorm(c.name)];
    if(!p){
      const held = tdPlan.unknown[c.isin] && tdPlan.unknown[c.isin].held;
      if(!held && !ticker){ unresolved++; continue; }              // verkauft/alt + kein Ticker → überspringen
      p={id:uid(),titel:c.name||ticker||c.isin,symbol:ticker,isin:(bk==="TR"?c.isin:""),branche:"",stop:"",kursAktuell:"",notiz:"",tx:[],div:[],_u:now};
      if(bk!=="TR")p.broker=bk;
      positions.push(p); if(bk==="TR")byIsin[bk+"|"+c.isin]=p; if(ticker)byTicker[bk+"|"+ticker]=p; isNew[p.id]=true; posMaxDate[p.id]=""; newPos++;
    } else { if(bk==="TR" && !p.isin){ p.isin=c.isin; if(mutate)touch(p); } if(ticker && !p.symbol){ p.symbol=ticker; if(mutate)touch(p); } }
    if(!used[p.id])used[p.id]=new Set();
    if(c.kind==="dividende"){
      // NETTO heisst netto: die Quellensteuer steht in der tax-Spalte und muss abgezogen werden.
      // Vorher landete hier der Bruttobetrag im Feld "netto" -> Dividenden dauerhaft zu hoch
      // (bei Zinsen war es von Anfang an richtig). Gefunden 27.08.2026 beim TR-Abgleich.
      const netto=c.amount-(c.tax||0);
      const m=(p.div||[]).find(d=>!used[p.id].has(d.id)&&!d.trid&&(d.datum||"").slice(0,10)===c.datum&&(Math.abs((num(d.netto)||0)-netto)<0.02||Math.abs((num(d.netto)||0)-c.amount)<0.02));
      if(m){ if(Math.abs((num(m.netto)||0)-c.amount)<0.02 && c.tax) m.netto=tdFmt(netto);   // alte Brutto-Buchung mitkorrigieren
             m.trid=c.trid; if(mutate)touch(m); used[p.id].add(m.id); backfill++; }
      else { const d={id:uid(),datum:c.datum,netto:tdFmt(netto),notiz:"TR-Import",trid:c.trid,_u:now}; (p.div||(p.div=[])).push(d); used[p.id].add(d.id); added++; }   // alle Dividenden (per trid dublettensicher)
    } else {
      const m=(p.tx||[]).find(t=>!used[p.id].has(t.id)&&!t.trid&&t.typ===c.kind&&(t.datum||"").slice(0,10)===c.datum&&Math.abs((num(t.stueck)||0)-c.stueck)<0.001&&Math.abs((num(t.kurs)||0)-c.kurs)<Math.max(0.02,c.kurs*0.01));
      if(m){ if(c.tax)m.steuer=tdFmt(c.tax); if(c.fee&&!(num(m.gebuehr)>0))m.gebuehr=tdFmt(c.fee); m.trid=c.trid; if(mutate)touch(m); used[p.id].add(m.id); backfill++; }
      else if(isNew[p.id]||c.datum>(posMaxDate[p.id]||"")){ const t={id:uid(),typ:c.kind,datum:c.datum,stueck:tdFmt(c.stueck),kurs:tdFmt(c.kurs),gebuehr:c.fee?tdFmt(c.fee):"",steuer:c.tax?tdFmt(c.tax):"",notiz:(c.frei?"Kapitalmaßnahme – Einstand prüfen":"TR-Import"),trid:c.trid,_u:now}; (p.tx||(p.tx=[])).push(t); used[p.id].add(t.id); added++; }
      else skippedBaseline++;
    }
    if(c.trid)seen.add(c.trid);
  }
  return {backfill, added, skippedSeen, skippedBaseline, newPos, unresolved}; }
function tdCsvPick(inp){ const f=inp.files[0]; if(!f)return; inp.value="";
  const rd=new FileReader();
  rd.onload=()=>{ try{ tdPlan=tdBuildPlan(rd.result); tdShowPreview(); }catch(e){ alert("CSV nicht lesbar: "+(e.message||e)); } };
  rd.readAsText(f); }
function tdShowPreview(){
  const sim=tdSimulate({}, false);
  const all=Object.values(tdPlan.unknown);
  const held=all.filter(u=>u.held).sort((a,b)=>(b.last||"").localeCompare(a.last||""));
  const closed=all.length-held.length;
  let h=`<h2>Trades importieren</h2>
    <div class="hint" style="margin-bottom:10px">CSV: ${tdPlan.total} Zeilen. Vorschau:<br>
    · <b>${sim.backfill}</b> Bestandsbuchung(en) bekommen Steuer/ID<br>
    · <b>${sim.newPos}</b> neue Position(en) · <b>${sim.added}</b> neue Buchung(en)${tdPlan.skipped?"<br>· "+tdPlan.skipped+" schon vorhanden":""}${closed?"<br>· "+closed+" verkaufte/alte Werte übersprungen":""}</div>`;
  if(held.length){
    h+=`<div class="hint" style="margin:0 0 6px"><b>${held.length} gehaltene neue Werte</b> werden aufgenommen. Yahoo-Ticker optional (für Live-Kurse) — leer = Position ohne Kurs, Käufe/Verkäufe trotzdem drin:</div>`;
    h+=`<div class="hint" id="tdSuggestStat" style="margin:0 0 8px">🔍 suche Ticker-Vorschläge…</div>`;
    for(const u of held)
      h+=`<div class="two" style="align-items:flex-end;margin-bottom:6px;gap:8px">
        <div class="field" style="flex:2;margin:0"><label style="opacity:.85">${esc(u.name||u.isin)} <span style="opacity:.5">${u.count}×</span></label></div>
        <div class="field" style="flex:1;margin:0"><input id="tdmap_${tdNorm(u.isin)}" placeholder="Ticker / leer" autocomplete="off"></div></div>`;
  }
  h+=`<div class="hint" style="margin:8px 0">Dedup über transaction_id — mehrfacher Import fügt nichts doppelt ein.</div>
    <div class="sheet-actions"><button class="btn sec" style="flex:1" onclick="tdPlan=null;closeSheet();">Abbrechen</button><button id="tdImportBtn" class="btn" style="flex:1" onclick="tdApplyPlan()"${held.length?' disabled':''}>${held.length?"Ticker werden gesucht…":"Importieren"}</button></div>`;
  openSheet(h); if(held.length)setTimeout(tdSuggestTickers,60); }
// Auto-Vorschlag: Yahoo-Suche je ISIN füllt die leeren Ticker-Felder vor (gedrosselt, best-effort).
// „Importieren" bleibt gesperrt, bis das durch ist — sonst reisst ein zu frueher Klick spaeter
// dran verarbeitete Werte leer (genau das ist Markus 25.08. bei Nokia passiert).
async function tdSuggestTickers(){
  const held=Object.values(tdPlan.unknown).filter(u=>u.held);
  const stat=document.getElementById("tdSuggestStat");
  const btn=document.getElementById("tdImportBtn");
  const rank={EQUITY:0,ETF:1,MUTUALFUND:2};
  let done=0, filled=0;
  const suche=async(q)=>{
    const b=await yahooJSON("/v1/finance/search?q="+encodeURIComponent(q)+"&quotesCount=8&newsCount=0");
    const qs=((b&&b.quotes)||[]).filter(x=>x.symbol&&(rank[x.quoteType]!=null));
    qs.sort((a,c)=>(rank[a.quoteType]??9)-(rank[c.quoteType]??9) || boersenRang(a.symbol)-boersenRang(c.symbol));
    return qs.length?qs[0].symbol:"";
  };
  const one=async(u)=>{
    try{
      let pick=await suche(u.isin);
      // ISIN-Suche findet kleinere/neuere Werte manchmal nicht (duennerer Index) -> Name als
      // Ruecksicherung, genau die Suche, die Markus im Editor von Hand erfolgreich nutzt.
      if(!pick && u.name) pick=await suche(u.name);
      if(pick){ const el=document.getElementById("tdmap_"+tdNorm(u.isin)); if(el&&!el.value){ el.value=pick; filled++; } }
    }catch(e){}
    done++; if(stat)stat.textContent="🔍 Vorschläge: "+done+"/"+held.length+" (befüllt: "+filled+")";
  };
  const CH=4;
  for(let i=0;i<held.length;i+=CH){ await Promise.all(held.slice(i,i+CH).map(one)); await sleep(150); }
  if(stat)stat.textContent="🔍 "+filled+"/"+held.length+" vorgeschlagen — bitte prüfen. Hebel/KO haben keinen Ticker (leer lassen), ETFs oft London-Listing (.L).";
  if(btn){ btn.disabled=false; btn.textContent="Importieren"; }
}
function tdApplyPlan(){ if(!tdPlan)return;
  const assign={}; for(const isin in tdPlan.unknown){ const v=(val("tdmap_"+tdNorm(isin))||"").trim(); if(v)assign[isin]=v.toUpperCase(); }
  state.settings.isinMap=Object.assign({}, state.settings.isinMap||{}, assign);
  const r=tdSimulate(assign, true);
  const kasse=tdKasseAktualisieren(tdPlan);
  save(); render(); syncPushLater(); tdPlan=null; closeSheet();
  toast("✓ "+r.backfill+" nachgetragen · "+r.added+" neu"+(r.skippedBaseline?" · "+r.skippedBaseline+" übersprungen":"")+(kasse?" · Konto "+kasse:"")); }

/* Kontostand und Zinsen aus der CSV auf das Verrechnungskonto schreiben — sonst müsste
   man den Saldo nach jedem Import von Hand nachtragen. Nur das TR-Konto; IBKR bleibt unberührt. */
function tdKasseAktualisieren(plan){
  if(!plan || plan.saldo==null) return "";
  let k=state.positions.find(p=>p.cash && (p.broker||"TR")!=="IBKR");
  if(!k){ k={id:uid(),titel:"Verrechnungskonto TR",cash:true,broker:"TR",currency:"EUR",cashBetrag:"",notiz:"",tx:[],div:[],_u:Date.now()};
    state.positions.push(k); }
  k.cashBetrag=fmtBetrag(plan.saldo);
  k.notiz="Saldo aus allen Geldflüssen der TR-CSV";
  const vorhanden=new Set((k.div||[]).map(d=>d.trid).filter(Boolean));
  for(const z of (plan.zinsen||[])){
    if(z.trid && vorhanden.has(z.trid)) continue;
    (k.div||(k.div=[])).push({id:uid(),datum:z.datum,netto:fmtBetrag(z.netto),notiz:"Zinsen",trid:z.trid,_u:Date.now()});
  }
  const vorhandenTax=new Set((k.taxOpt||[]).map(d=>d.trid).filter(Boolean));
  for(const s of (plan.steueropt||[])){
    if(s.trid && vorhandenTax.has(s.trid)) continue;
    (k.taxOpt||(k.taxOpt=[])).push({id:uid(),datum:s.datum,betrag:fmtBetrag(s.betrag),trid:s.trid,notiz:s.notiz||"",_u:Date.now()});
  }
  touch(k);
  return k.cashBetrag+" €";
}
function fmtBetrag(n){ return (Math.round(n*100)/100).toFixed(2).replace(".",","); }

/* ---------- Helper ---------- */
function val(id){const e=document.getElementById(id);return e?e.value:"";}
let toastT;
function toast(msg){const t=document.getElementById("toast");if(!t)return;
  t.textContent=msg;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1400);}

render();
// Kurse beim Start automatisch laden (leise, nicht blockierend)
if(state.settings.autoRefresh!==false) refreshPrices(true);
// Auto-Refresh alle 5 Min, solange die App sichtbar ist (tagsüber immer frische Kurse; „Stand"-Zeit erscheint nur, wenn Kurs >30 Min alt = WE/außerhalb Handelszeit)
let priceTimer=null;
function startPriceTimer(){ clearInterval(priceTimer); if(state.settings.autoRefresh===false) return;
  priceTimer=setInterval(()=>{ if(document.visibilityState==="visible") refreshPrices(true); }, 300000); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.settings.autoRefresh!==false) refreshPrices(true); });
let clampT; addEventListener("resize",()=>{ clearTimeout(clampT); clampT=setTimeout(scheduleClamp,120); });
startPriceTimer();
// Beim Start mit GitHub abgleichen (holen → mergen → zurückschreiben)
if(syncReady()) fullSync(false);
</script>
