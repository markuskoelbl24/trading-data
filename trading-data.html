<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading-Data (FIFO)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- IBM Plex: Mono fuer ALLE Zahlen (Ziffern stehen untereinander), Condensed fuer Spaltenkoepfe.
     Faellt ohne Netz sauber auf Systemschriften zurueck. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Kursblatt: Tinten-Navy als Papier, Messing als Akzent. Gruen/Rot bleiben die
       einzigen weiteren Farben — sie tragen Bedeutung (Gewinn/Verlust), nichts sonst. */
    --bg:#0e131a; --card:#161d26; --card2:#1c242e; --line:#2b3441; --rule:#333e4c;
    --txt:#e9e6df; --muted:#8b95a2; --accent:#c2a15a;     /* Messing statt Standard-Blau */
    --green:#3fa97a; --red:#d2544b; --amber:#e0813c;      /* Warnung klar getrennt vom Messing */
    --radius:12px;
    --f-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* Spaltenkopf wie im Kursblatt: schmal, versal, weit gesperrt, klein. */
  .kpi .k,.skpi .k,.grp-title,.sortsel .sl,label,.esb-lab .n{
    font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
  /* Jede Zahl in Mono mit Tabellenziffern — Betraege stehen dadurch stellengenau untereinander. */
  .kpi .v,.kpi .v2,.ph-kurs,.ph-day,.tx .amt,.skpi .v,.esb-lab .v,.esb-pct,.ph-sub b,.meta b,
  .es-vals b,.total .v{
    font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  /* Sichtbarer Tastatur-Fokus (fehlte bisher ganz). */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:var(--f-sans);-webkit-text-size-adjust:100%}
  body{padding:54px 12px calc(96px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto}
  h1{font-size:20px;margin:2px 0 2px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.4}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  .btn{background:var(--accent);color:#17120a;padding:10px 14px;font-weight:600}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 10px;font-size:13px}
  .btn.sm{padding:6px 10px;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  input,select{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 11px;width:100%;min-width:0}
  input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
  label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}
  .pos{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 13px 11px;margin:12px 0;position:relative}
  /* Zugeklappte Karte bekommt unten einen kleinen Griff — zeigt „hier geht noch was auf",
     ohne dass ein Pfeil neben dem Namen stört. */
  .pos.zu{padding-bottom:15px;cursor:pointer}
  .pos.zu::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:26px;height:3px;border-radius:2px;background:var(--rule)}
  .pos.zu:hover::after{background:var(--accent)}
  .pos-head{display:flex;align-items:flex-start;gap:10px}
  .badge{font-family:var(--f-cond);letter-spacing:.06em;font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    padding:2px 8px;border-radius:999px;white-space:nowrap}
  .titel{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:break-word}   /* war 1.15: beim Umbruch stiessen die Marken an */
  .titel .badge{vertical-align:1px}
  .titel .nobr{white-space:nowrap}   /* letztes Wort + Marken wandern gemeinsam in die naechste Zeile */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 4px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 9px 8px}
  .kpi .k{font-size:9.5px;color:var(--muted);margin-bottom:4px}
  .kpi .v{font-size:clamp(11.5px,3.5vw,15px);font-weight:600;white-space:nowrap;letter-spacing:-.3px}
  .kpi .v2{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:8px 2px 2px}
  .meta b{color:var(--txt);font-weight:600}
  .meta .archiv{color:var(--muted)}
  .meta .archiv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .einstand{margin:10px 0 2px;padding:9px 11px 11px;background:var(--card2);
    border:1px solid var(--line);border-radius:11px;font-size:13px}
  .es-vals{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  .es-vals .lbl{color:var(--muted)}
  .es-vals b{font-weight:700}
  .es-vals .be-delta{margin-left:auto;font-weight:700;white-space:nowrap}
  .g{display:inline-block;vertical-align:middle}
  .g.ring{width:9px;height:9px;border:2px solid var(--muted);border-radius:50%;background:transparent;margin-right:1px}
  .g.bar{width:3px;height:12px;background:var(--txt);border-radius:2px;margin-right:2px}
  .g.dot{width:10px;height:10px;border-radius:50%;margin-right:1px}
  .g.dot.up{background:var(--green)} .g.dot.down{background:var(--red)}
  .es-bar{position:relative;height:22px;margin-top:11px}
  .es-track{position:absolute;top:9px;left:2px;right:2px;height:4px;background:var(--line);border-radius:3px}
  .es-fill{position:absolute;top:8px;height:6px;border-radius:3px;opacity:.9}
  .es-fill.up{background:var(--green)} .es-fill.down{background:var(--red)}
  .es-mark{position:absolute;transform:translateX(-50%)}
  .es-mark.ring{top:2px;width:12px;height:12px;border:2px solid var(--muted);border-radius:50%;background:var(--card2)}
  .es-mark.bar{top:0;width:3px;height:20px;background:var(--txt);border-radius:2px}
  .es-mark.dot{top:2px;width:15px;height:15px;border-radius:50%;border:3px solid var(--card2)}
  .es-mark.dot.up{background:var(--green)} .es-mark.dot.down{background:var(--red)}
  .pos-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .pos-actions .btn{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:600}
  .pos-actions .btn.sec{color:var(--txt);border-color:var(--line)}
  details{margin-top:9px;border-top:1px solid var(--rule);padding-top:9px}
  summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  .tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;
    padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .tx:last-child{border-bottom:none}
  .tx .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .tx .tag{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.07em}
  .tag.kauf{background:transparent;color:var(--muted);border:1px solid var(--rule)}
  .tag.verkauf{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .tag.div{background:transparent;color:var(--green);border:1px solid var(--green)}
  .tx .desc{color:var(--muted);font-size:12px;min-width:0}
  .tx .desc .nb{white-space:nowrap}
  .tx .amt{font-weight:700;text-align:right;white-space:nowrap}
  .tx .txedit{color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:8px;padding:3px 8px;font-size:12px}
  .pos-empty{color:var(--muted);font-size:13px;padding:6px 2px}
  .pos.warn{border-color:var(--amber)}
  .warnmsg{color:var(--amber);font-size:12.5px;margin:8px 2px 0}
  .pos.stop{border-color:var(--red)}
  .stopmsg{color:var(--red);font-size:12.5px;margin:8px 2px 0;font-weight:600}
  .badge.badge-red{color:#ffb4b0;border-color:var(--red);background:rgba(240,85,77,.14)}
  .divchip{font-variant-numeric:tabular-nums;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;
    padding:4px 10px 4px 7px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.35;
    white-space:nowrap;flex-wrap:nowrap}   /* nie INNERHALB des Chips umbrechen: sonst schwebt das
    Häkchen mittig zwischen zwei Zeilen und die Beschriftung sitzt sichtbar zu hoch */
  /* Optischer Ausgleich: Beschriftung und Ziffern haben keine Unterlängen, ihre sichtbare Masse
     sitzt daher über der Mitte der Zeilenbox. Rechnerisch mittig wirkt das Häkchen sonst zu tief. */
  .divchip .cbox{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:0 0 auto;
    border-radius:3px;border:1.5px solid var(--green);background:var(--green);color:#04120a;font-size:9.5px;font-weight:800;line-height:1}
  .divchip.off{color:var(--txt)}   /* nicht ausgrauen — sonst wirkt der Chip verschwunden */
  /* Bestand als Leitzahl, darunter ein Balken: wie viel arbeitet, wie viel liegt still */
  .hero{display:flex;align-items:baseline;gap:9px;margin:11px 0 0}
  .hero .k{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--muted)}
  .hero .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(19px,5.5vw,25px);font-weight:600;letter-spacing:-.5px}
  .split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--card2);margin:9px 0 7px}
  .split i{display:block;height:100%}
  .split .inv{background:var(--accent)}
  .split .cash{background:var(--muted);opacity:.45}
  .splitlab{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:11.5px;color:var(--muted)}
  .splitlab b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}
  .splitlab .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
  .splitlab .dot.inv{background:var(--accent)} .splitlab .dot.cash{background:var(--muted);opacity:.45}
  .fusszeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
  .fussmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
  .totchips{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:0}   /* nicht strecken */
  /* NICHT baseline: sobald der kleinere „von …"-Zusatz dazukommt, waechst die Zeile und das
     Haekchen rutscht nach unten — genau der sichtbare Versatz. Mittig haelt alles auf einer Linie. */
  .totchips .divchip{padding:4px 11px 4px 7px;gap:6px;align-items:center}
  .totchips .divchip .cbox{align-self:center}   /* nur das Kaestchen bleibt mittig */
  .divchip .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
  .divchip.off .amt{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
  .divchip .sub{color:var(--muted);font-size:11px}
  .divchip .chiptxt{display:inline}   /* eine Einheit: Beschriftung, Betrag und Zusatz auf einer Schriftlinie */
  .divchip.off .cbox{background:transparent;border-color:var(--muted)}
  .closed-sec{margin-top:22px}
  .closed-sec>summary.closed-sum{margin:0 3px 2px;padding:6px 0}
  .closed-sec .pos{opacity:.82}
  .green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)}
  .grp-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
    margin:20px 3px 2px;font-weight:700}
  /* --- Redesign Karten-Kopf --- */
  .pos-head{cursor:pointer}
  .pos-head.cash{cursor:default}
  .pos-head.cash .ph-sub{gap:7px;margin-top:6px}
  .ph-left{flex:1;min-width:0}
  .ph-sub{color:var(--muted);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 9px;align-items:center}
  .ph-sub b{color:var(--txt);font-weight:700}
  .ph-sub .ph-ges{white-space:nowrap}
  .ph-sub .gv{cursor:pointer}
  .ph-sub .gv.green{color:var(--green)} .ph-sub .gv.red{color:var(--red)}
  .ph-right{text-align:right;white-space:nowrap}
  .ph-kurs{font-size:17px;font-weight:700}
  .ph-kurs.soft{color:var(--muted)}   /* Kurs von Hand oder ausgeknockt → nicht als Live-Kurs lesen */
  .ph-day{font-size:13px;font-weight:700;margin-top:2px;cursor:pointer;display:inline-block}
  .ph-day.up{color:var(--green)} .ph-day.down{color:var(--red)} .ph-day.flat{color:var(--muted);cursor:default}
  .ph-edit{align-self:flex-start}
  .pos-body{margin-top:12px}
  /* Sortier-Leiste */
  .sortsel{display:flex;align-items:center;gap:9px;margin:16px 3px 4px}
  .sortsel .sl{color:var(--muted);font-size:10.5px}
  /* Fixierte Kopfleiste: erscheint erst, wenn der Portfolio-Block weggescrollt ist.
     Bewusst nur die drei Kennzahlen + Suche — nicht der ganze Block. */
  /* Dauerhaft angedockte Leiste: oben traegt sie den Titel, beim Scrollen die drei Kennzahlen.
     Dadurch verschwindet die grosse Ueberschrift beim Runterscrollen und der Platz wird genutzt. */
  .sticky{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;
    padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left));
    background:rgba(14,19,26,.94);border-bottom:1px solid var(--rule)}
  .sticky .brand{font-size:15px;font-weight:700;flex:0 0 auto;white-space:nowrap}
  .sticky .brand span{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
  .sticky.q .brand{display:none}                      /* bei offener Suche weichen */
  /* Am Handy ist kein Platz fuer beides. Die Auswahl muss GENAUER sein als die Grundregeln
     weiter unten, sonst gewinnen die (gleiche Gewichtung, spaeter im Stylesheet). */
  @media (max-width:699px){
    .sticky.scrolled .brand{display:none}
    .sticky .skpis{gap:5px;justify-content:flex-start}   /* mitwandernd, linksbuendig */
    .sticky .skpi{padding:3px 7px 4px}
    .sticky .skpi .v{font-size:12px;word-spacing:-2.5px}   /* Euro dichter an die Zahl */
    .sticky .skpi .k{font-size:8.5px}
  }
  @supports (backdrop-filter:blur(8px)){ .sticky{backdrop-filter:blur(8px)} }
  /* Kennzahlen mittig, in denselben Kästen wie auf den Karten */
  .skpi{display:flex;flex-direction:column;line-height:1.15;min-width:0;
    background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px 5px}
  .skpi .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .skpi .v{font-size:12.5px;font-weight:600;white-space:nowrap}
  .skpis{display:none;gap:6px;flex:1 1 auto;justify-content:center;min-width:0}
  @media (min-width:700px){   /* nur wo Platz ist: echt auf Seitenmitte */
    .sticky.scrolled .skpis{position:absolute;left:50%;transform:translateX(-50%);flex:0 0 auto}
  }
  /* Suche und Setup bleiben immer am rechten Rand — auch wenn die Kennzahlen fehlen */
  .sright{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
  .sticky.scrolled .skpis{display:flex}
  .sticky input{flex:0 1 190px;min-width:0;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:7px 10px;font-size:13px;display:none}
  .sticky.q input{display:block}
  .sticky.q .skpis{display:none!important}
  /* Beide Knoepfe exakt gleich gross und quadratisch, Zeichen optisch mittig */
  .sfind{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    width:34px;height:34px;padding:0;font-size:14px;flex:0 0 auto;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .sfind.gear{font-size:26px}
  @media (min-width:700px){                      /* Am Rechner ist Platz: Feld gleich sichtbar */
    .sticky input{display:block}
    .sticky.q.scrolled .skpis{display:flex!important}
  }
  .sortseg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  /* Zeitraum-Reiter direkt neben der Überschrift — schmaler als die Sortier-Leiste,
     und bei vielen Jahren am Handy seitlich schiebbar statt umbrechend. */
  .yearseg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex:0 1 auto;min-width:0}   /* nimmt nur den noetigen Platz, schiebt statt umzubrechen */
  .yearseg::-webkit-scrollbar{display:none}
  .yearseg button{background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;
    padding:4px 8px;border-radius:0;white-space:nowrap;border:0;flex:0 0 auto}
  .yearseg button.on{background:var(--accent);color:#17120a}
  .sortseg button{background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:0}
  .sortseg button.on{background:var(--accent);color:#17120a}
  /* Break-even-Leiste (Labels an Markern, zentriert) */
  .esb{position:relative;height:66px;margin:4px 2px 2px}
  .esb-trk{position:absolute;left:0;right:0;top:38px;height:4px;border-radius:0;background:var(--line);transform:translateY(-50%)}
  .esb-trk::before,.esb-trk::after{content:"";position:absolute;top:-4px;width:1px;height:12px;background:var(--rule)}
  .esb-trk::before{left:0} .esb-trk::after{right:0}   /* Skalenenden wie auf einem Messstab */
  .esb-fill{position:absolute;top:38px;height:4px;border-radius:0;transform:translateY(-50%)}
  .esb-fill.up{background:var(--green)} .esb-fill.down{background:var(--red)}
  .esb-mk{position:absolute;top:38px;transform:translate(-50%,-50%)}
  .esb-mk .d{width:11px;height:11px;border-radius:50%}
  .esb-mk.e .d{background:transparent;border:2px solid var(--muted)}
  .esb-mk.j .d{width:14px;height:14px;background:var(--txt);border:3px solid var(--card)}
  .esb-mk.b .l{width:2px;height:30px;border-radius:0;background:var(--accent);
    box-shadow:0 0 0 3px var(--card)}   /* Break-even zieht als Lot durch die ganze Leiste */
  .esb-lab{position:absolute;font-size:11.5px;white-space:nowrap}
  .esb-lab .n{color:var(--muted)} .esb-lab .v{font-weight:700}
  .esb-lab.e .v,.esb-lab .pl.e .v{color:var(--muted);font-weight:600}   /* Einstieg grau wie sein Marker */
  .esb-lab.j .v{color:var(--txt)}                                        /* aktueller Kurs weiß wie sein Marker */
  .esb-lab.pair{display:inline-flex;gap:14px}
  .esb-pct{position:absolute;top:38px;transform:translate(-50%,-50%);font-size:11px;font-weight:700;background:var(--card);padding:1px 5px;border-radius:6px;white-space:nowrap}
  .esb-pct.up{color:var(--green)} .esb-pct.down{color:var(--red)}
  .esb-lab.top{top:5px} .esb-lab.bot{top:50px}
  .esb-lab.be .v{color:var(--accent)}
  /* Portfolio-Summe */
  .total{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--accent);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:6px}
  .total .kpis{margin:8px 0 0}
  .total .v{font-size:clamp(11.5px,3.4vw,15px)}
  /* Overlay/Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;
    align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px 15px 24px}
  @media(min-width:560px){.overlay{align-items:center}.sheet{border-radius:18px}}
  .sheet h2{font-size:17px;margin:2px 0 12px}
  .field{margin-bottom:11px}

<script>
"use strict";
const LS="trading_data_v1";
const LS_OLD="trading_tracker_v1";   // alter Schlüssel → wird beim ersten Laden migriert
let state=load();
const openDetails=new Set();   // welche Buchungs-Listen offen sind (bleibt über Re-Renders erhalten)
function captureOpenDetails(){  // Offen-Zustand aus dem aktuellen DOM übernehmen, bevor neu gerendert wird
  document.querySelectorAll("#list details[data-pid]").forEach(d=>{
    const id=d.getAttribute("data-pid");
    if(d.open)openDetails.add(id); else openDetails.delete(id);
  });
}

/* ---------- Persistenz ---------- */
function load(){
  let s={positions:[]};
  try{
    let r=localStorage.getItem(LS);
    if(!r){ const old=localStorage.getItem(LS_OLD); if(old){ localStorage.setItem(LS,old); r=old; } } // alten Speicher übernehmen
    if(r)s=JSON.parse(r);
  }catch(e){}
  if(!s.positions)s.positions=[];
  if(!s.settings)s.settings={};
  if(s.settings.autoRefresh===undefined)s.settings.autoRefresh=true;   // Kurse beim Start auto-laden
  if(!s.settings.sortBy)s.settings.sortBy="size";
  if(!s.settings.dayMode)s.settings.dayMode="pct";
  if(!s.settings.gesMode)s.settings.gesMode="eur";
  if(!s.settings.collapsed)s.settings.collapsed={};
  if(!s.settings.gh)s.settings.gh={token:"",repo:"",path:"trading.json",branch:"main"}; // Sync-Config (lokal, NICHT gesynct)
  if(s.settings.autoSync===undefined)s.settings.autoSync=true;  // nach Änderungen automatisch hochladen
  if(!s.tombstones)s.tombstones={};   // id -> Löschzeitpunkt (ms), gegen Lösch-Zombies beim Merge
  return s;
}
function save(){localStorage.setItem(LS,JSON.stringify(state));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function touch(o){ if(o)o._u=Date.now(); return o; }   // Änderungszeit markieren (für Merge)

/* ---------- Parsen / Formatieren ---------- */
function num(v){                                   // versteht "1.234,56" und "1234.56"
  if(typeof v==="number")return v;
  if(v==null)return 0;
  let s=String(v).trim().replace(/\s|€/g,"");
  if(s==="")return NaN;
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".");}   // deutsch
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
const eur=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const pct=new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const numf=new Intl.NumberFormat("de-DE",{maximumFractionDigits:4});
const _fmtCache={EUR:eur};
let _dispCur="EUR";   // Anzeige-Währung des gerade gerenderten Blocks (Position nativ, Summen in EUR)
let _depotWert=0;     // Depotwert inkl. Cash (in EUR) — Bezugsgröße für den Anteil je Position
function _cf(cur){ cur=String(cur||"EUR").toUpperCase(); if(!/^[A-Z]{3}$/.test(cur))cur="EUR"; let f=_fmtCache[cur]; if(!f){ try{ f=_fmtCache[cur]=new Intl.NumberFormat("de-DE",{style:"currency",currency:cur,maximumFractionDigits:2}); }catch(e){ f=_fmtCache[cur]=eur; } } return f; }
function emoney(n){ return _cf(_dispCur).format(n); }
function feur(n){return (n==null||isNaN(n))?"–":emoney(n);}
function fpct(n){return (n==null||isNaN(n))?"–":(n>=0?"+":"")+pct.format(n)+" %";}
function signEur(n){return (n>=0?"+":"")+emoney(n);}
/* Schmale Ansicht: in der Leiste reichen volle Euro — die Cents stehen in der Kachel darunter.
   Dadurch passen die drei Kaesten in die echte Seitenmitte, ohne die Knoepfe zu ueberdecken. */
const _schmal=()=>window.matchMedia("(max-width:699px)").matches;
let _rundfmt=null;
function signEurKurz(n){
  if(!_rundfmt) _rundfmt=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  return (n>=0?"+":"")+_rundfmt.format(n);
}
function cls(n){return n>0?"green":(n<0?"red":"");}
function fdate(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return d+"."+m+"."+y.slice(2);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- FIFO-Kern ---------- */
/* Marken (Broker, Anteil) sollen nie ALLEIN in einer neuen Zeile stehen: letztes Titelwort
   und Marken bilden eine untrennbare Gruppe — passt die Marke nicht mehr, wandert das Wort mit. */
function titelMitMarken(text, marken){
  const t=esc(text||"");
  if(!marken) return t;
  const i=t.lastIndexOf(" ");
  const rest = i>0 ? t.slice(i+1) : t;
  // Einwort-Titel koennen nichts mitnehmen (sonst bliebe Zeile 1 leer) -> Marken bleiben
  // wenigstens untereinander zusammen; sonst wandert das letzte Wort mit nach unten.
  if(i<=0 || rest.length>16) return t+' <span class="nobr">'+marken.replace(/^\s+/,"")+'</span>';
  return t.slice(0,i+1)+'<span class="nobr">'+rest+marken+'</span>';
}
// Kurs einer einzelnen Buchung (Kauf/Verkauf/Dividende) EUR je 1 Einheit Fremdwährung:
// historisch (t.fx, vom Broker taggenau geliefert), sonst Rückfall auf den aktuellen Kurs.
function fxVon(t, liveRate){ const v=num(t&&t.fx); return v>0?v:liveRate; }
function compute(pos){
  // Cash-Konto: kein FIFO, kein Break-even — nur Saldo (+ Zinsen als „Dividende")
  if(pos.cash){
    const bal=num(pos.cashBetrag)||0;
    const divs=(pos.div||[]).reduce((s,d)=>s+(num(d.netto)||0),0);
    const divCounted=!pos.divOff && !state.settings.zinsGlobalOff;   // eigener Schalter fuer Zinsen
    // TR bucht ueber "Tax Optimisation" spaeter Steuer aus dem Verlusttopf zurueck (oder selten nach) —
    // das ist keinem Titel zuzuordnen, sondern reines Verrechnungskonto-Geschehen. + = Erstattung.
    const taxOptSum=(pos.taxOpt||[]).reduce((s,t)=>s+(num(t.betrag)||0),0);
    const steuerCounted=!!state.settings.steuerGlobalOn;
    // Cash-Konten sind immer EUR-nativ -> Eur-Felder = native Felder (keine Umrechnung nötig)
    const gesamt=(divCounted?divs:0)+(steuerCounted?taxOptSum:0);
    return {tx:[],realized:0,realizedEur:0,openQty:0,openCost:0,openCostEur:0,avg:0,curVal:bal,curValEur:bal,unreal:0,unrealEur:0,divs,divsEur:divs,
      gesamt,gesamtEur:gesamt,hasKurs:true,oversell:false,buyCostAll:0,
      gesamtPct:NaN,unrealPct:NaN,jahr:NaN,first:"",last:"",closed:false,days:0,perTx:{},kurs:bal,
      erstEinstieg:NaN,breakEven:NaN,beDelta:NaN,bePct:NaN,steuer:-taxOptSum,steuerCounted,taxOpt:taxOptSum,isCash:true,
      archivReal:0,archivDivs:0};
  }
  // Transaktionen chronologisch (stabil nach Eingabereihenfolge)
  const tx=(pos.tx||[]).map((t,i)=>({...t,_i:i}))
    .sort((a,b)=> (a.datum<b.datum?-1:a.datum>b.datum?1:a._i-b._i));
  // Signierte FIFO-Schlange: hält Long- ODER Short-Lots. Ein Trade, der gegen die
  // offene Richtung läuft, schließt zuerst (realisiert), der Rest eröffnet neu.
  // So zählt Leerverkauf→Eindeckung sauber als geschlossener Trade mit korrektem Gewinn;
  // bei Roundtrips ist das Ergebnis sogar unabhängig von der Buchungs-Reihenfolge.
  const cur=(pos.currency||"EUR").toUpperCase();
  const _fxAll=(state.settings&&state.settings.fxRates)||{};
  const liveRate=cur==="EUR"?1:(_fxAll[cur]>0?_fxAll[cur]:1);   // aktueller Kurs, nur Rückfall
  const lots=[];
  let realized=0, realizedEur=0, oversell=false, buyCostAll=0, steuerSum=0;
  const perTx={};           // Ergebnis je schließendem Trade (fürs Anzeigen der Paarung)
  for(const t of tx){
    const st=num(t.stueck), ku=num(t.kurs), ge=num(t.gebuehr)||0;
    if(!(st>0)||isNaN(ku))continue;
    steuerSum+=num(t.steuer)||0;   // Steuer wird gesammelt, aber nur auf Wunsch verrechnet (s.u.)
    const fps=ge/st;                                 // Gebühr pro Stück
    const side=t.typ==="kauf"?"long":"short";        // Richtung dieses Trades
    if(t.typ==="kauf") buyCostAll+=st*ku+ge;
    const txFx=fxVon(t,liveRate);     // Tageskurs DIESER Buchung (historisch, sonst Rückfall aktuell)
    let qty=st, r=0, rEur=0, matched=[];
    // Läuft der Trade gegen offene Gegen-Lots? → zuerst schließen (realisieren)
    while(qty>1e-9 && lots.length && lots[0].side!==side){
      const lot=lots[0];
      const q=Math.min(qty,lot.q);
      // Long-Lot per Verkauf: Erlös−Einstand. Short-Lot per Kauf: Short-Erlös−Rückkauf.
      const rr = lot.side==="long"
        ? (q*ku - q*fps) - (q*lot.price + q*lot.fps)
        : (q*lot.price - q*lot.fps) - (q*ku + q*fps);
      // In Euro: beide Seiten JEWEILS mit ihrem eigenen Tageskurs — nicht die
      // Fremdwährungs-Differenz mit einem einzigen (heutigen) Kurs umgerechnet.
      const rrEur = lot.side==="long"
        ? (q*ku*txFx - q*fps*txFx) - (q*lot.price*lot.fx + q*lot.fps*lot.fx)
        : (q*lot.price*lot.fx - q*lot.fps*lot.fx) - (q*ku*txFx + q*fps*txFx);
      r+=rr; rEur+=rrEur;
      matched.push({q,price:lot.price});
      lot.q-=q; qty-=q;
      if(lot.q<=1e-9)lots.shift();
    }
    if(matched.length){ realized+=r; realizedEur+=rEur; perTx[t.id]={realized:r,realizedEur:rEur,matched,steuer:num(t.steuer)||0}; }
    // Rest eröffnet neue Lots in Trade-Richtung — Tageskurs wird mitgeführt (fürs spätere Schließen)
    if(qty>1e-9) lots.push({q:qty, price:ku, fps, side, fx:txFx});
  }
  // Steuer: standardmäßig NICHT eingerechnet (Kursbetrachtung vor Steuer).
  // Per Chip an der Position zuschaltbar — dann mindert sie Realisiert, Gesamt und hebt den Break-even.
  const steuerCounted=!!pos.steuerOn || !!(state.settings&&state.settings.steuerGlobalOn);   // pro Position ODER global
  if(steuerCounted){ realized-=steuerSum; realizedEur-=steuerSum; }   // Steuer nur bei TR (immer EUR)
  const longLots=lots.filter(l=>l.side==="long");
  const openQty=longLots.reduce((s,l)=>s+l.q,0) - lots.filter(l=>l.side==="short").reduce((s,l)=>s+l.q,0);
  const openCost=longLots.reduce((s,l)=>s+l.q*(l.price+l.fps),0);   // nur Long-Bestand
  const openCostEur=longLots.reduce((s,l)=>s+l.q*(l.price+l.fps)*l.fx,0);   // je Lot zu SEINEM Einstandskurs
  const avg=openQty>0?openCost/openQty:0;
  if(openQty<-1e-9) oversell=true;   // endet netto leerverkauft → wahrscheinlich fehlende Kauf-Daten
  // Ausgeknockt/ausgelaufen (Yahoo führt es nicht mehr): wie im Depot beim Broker mit 0 € rechnen,
  // bis die echte Ausbuchung per TR-CSV kommt. Der letzte Kurs bleibt in den Daten stehen.
  const kurs=pos.kursDead?0:num(pos.kursAktuell);
  const hasKurs=!isNaN(kurs)&&openQty>0;
  const curVal=hasKurs?openQty*kurs:0;
  const curValEur=hasKurs?openQty*kurs*liveRate:0;   // heutiger Wert -> heutiger Kurs (richtig so)
  const unreal=hasKurs?curVal-openCost:0;
  const unrealEur=hasKurs?curValEur-openCostEur:0;
  const divs=(pos.div||[]).reduce((s,d)=>s+ (num(d.netto)||0),0);
  const divsEur=(pos.div||[]).reduce((s,d)=>s+ (num(d.netto)||0)*fxVon(d,liveRate),0);
  const divCounted=!pos.divOff && !state.settings.divGlobalOff;   // global aus ODER pro Position abwählbar
  // Frühere, abgeschlossene Phasen liegen verdichtet als Jahreswerte vor (siehe archivBis).
  // Sie zählen in die Summen, aber NICHT in Break-even und Einstand — das ist ein anderer Play.
  // (Immer TR/EUR -> keine Fremdwährungs-Umrechnung nötig, in EUR und nativ identisch.)
  const summe=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
  const archivReal=summe(pos.archiv), archivDivs=summe(pos.archivDiv), archivSteuer=summe(pos.archivSteuer);
  const gesamt=realized+(hasKurs?unreal:0)+(divCounted?divs:0)+archivReal+(divCounted?archivDivs:0)-(steuerCounted?archivSteuer:0);
  const gesamtEur=realizedEur+(hasKurs?unrealEur:0)+(divCounted?divsEur:0)+archivReal+(divCounted?archivDivs:0)-(steuerCounted?archivSteuer:0);
  // Zeit & Jahresrendite
  const dates=tx.map(t=>t.datum).filter(Boolean).sort();
  const first=dates[0], last=dates[dates.length-1];
  const closed=openQty<=1e-9;
  const endD=closed?last:today();
  const days=first?Math.max(1,daysBetween(first,endD)):0;
  const gesamtPct=buyCostAll>0?gesamt/buyCostAll*100:NaN;
  const unrealPct=openCost>0?unreal/openCost*100:NaN;
  const jahr=(days>0&&!isNaN(gesamtPct))?gesamtPct*365/days:NaN;
  // Einstand / "runtergetradet": erster Kaufkurs vs. effektiver Break-even
  const firstBuy=tx.find(t=>t.typ==="kauf");
  const erstEinstieg=firstBuy?num(firstBuy.kurs):NaN;
  // Break-even = Kurs, bei dem GESAMT-Position (inkl. realisiert, ohne unreal) = 0
  const breakEven=openQty>0?(openCost-realized-(divCounted?divs:0))/openQty:NaN;
  const beDelta=(!isNaN(erstEinstieg)&&!isNaN(breakEven))?breakEven-erstEinstieg:NaN;
  const bePct=(!isNaN(beDelta)&&erstEinstieg)?beDelta/erstEinstieg*100:NaN;
  return {tx,realized,realizedEur,openQty,openCost,openCostEur,avg,curVal,curValEur,unreal,unrealEur,divs,divsEur,gesamt,gesamtEur,hasKurs,
    oversell,buyCostAll,gesamtPct,unrealPct,jahr,first,last,closed,days,perTx,kurs,
    erstEinstieg,breakEven,beDelta,bePct,steuer:steuerSum+archivSteuer,steuerCounted,archivReal,archivDivs};
}

/* ---------- Jahresauswertung ----------
   Realisiert je Jahr = Summe der FIFO-Ergebnisse der Trades, die in dem Jahr GESCHLOSSEN
   haben (perTx hängt am schließenden Trade). Unrealisiertes gibt es nur für heute — ein
   Depotwert von Silvester 2024 ließe sich nur mit historischen Kursen rekonstruieren. */
function yearsAvailable(){
  const ys=new Set();
  for(const p of state.positions){
    for(const t of (p.tx||[])) if(t.datum) ys.add(String(t.datum).slice(0,4));
    for(const d of (p.div||[])) if(d.datum) ys.add(String(d.datum).slice(0,4));
    for(const y of Object.keys(p.archiv||{})) ys.add(y);
    for(const y of Object.keys(p.archivDiv||{})) ys.add(y);
  }
  return [...ys].filter(y=>/^\d{4}$/.test(y)).sort();
}
/* Bestand und Einstand zum Stichtag — signierte FIFO wie in compute(), aber nur über
   Buchungen bis einschließlich `end`. Damit ist der Jahresend-Bestand exakt rekonstruierbar;
   fehlen kann nur der Kurs von damals (den halten wir in p.yearPx fest). */
function stateAsOf(pos,end){
  const tx=(pos.tx||[]).map((t,i)=>({...t,_i:i})).filter(t=>String(t.datum||"")<=end)
    .sort((a,b)=>(a.datum<b.datum?-1:a.datum>b.datum?1:a._i-b._i));
  const lots=[];
  for(const t of tx){
    const st=num(t.stueck), ku=num(t.kurs), ge=num(t.gebuehr)||0;
    if(!(st>0)||isNaN(ku))continue;
    const fps=ge/st, side=t.typ==="kauf"?"long":"short";
    let qty=st;
    while(qty>1e-9 && lots.length && lots[0].side!==side){
      const lot=lots[0], q=Math.min(qty,lot.q);
      lot.q-=q; qty-=q; if(lot.q<=1e-9)lots.shift();
    }
    if(qty>1e-9) lots.push({q:qty,price:ku,fps,side});
  }
  const L=lots.filter(l=>l.side==="long");
  return {openQty:L.reduce((s,l)=>s+l.q,0)-lots.filter(l=>l.side==="short").reduce((s,l)=>s+l.q,0),
          openCost:L.reduce((s,l)=>s+l.q*(l.price+l.fps),0)};
}
// Unrealisierter Stand am Jahresende (nur wenn ein Kurs für dieses Jahr festgehalten wurde)
function unrealAtYearEnd(pos,y){
  const px=(pos.yearPx||{})[y];
  if(px==null) return null;
  const a=stateAsOf(pos,y+"-12-31");
  if(a.openQty<=1e-9) return 0;          // nichts gehalten → nichts unrealisiert
  return a.openQty*px - a.openCost;
}
function yearStats(y){
  const fx=state.settings.fxRates||{};
  let real=0,divs=0,steuer=0,trades=0,wert=0,fehlt=0,mitKurs=0,baseWert=0;
  const vor=String(+y-1);
  for(const p of state.positions){
    const cur=(p.currency||"EUR").toUpperCase();
    const rate=cur==="EUR"?1:(fx[cur]>0?fx[cur]:1);
    const m=compute(p);
    for(const t of m.tx){
      if(String(t.datum||"").slice(0,4)!==y) continue;
      const r=m.perTx[t.id];
      // Mit dem Tageskurs DIESES Trades umgerechnet, nicht mit dem heutigen — sonst würde ein
      // vor Jahren geschlossener Trade rückwirkend am heutigen Kurs "neu bewertet".
      if(r&&r.matched&&r.matched.length){ real+=r.realizedEur; trades++; }
      steuer+=(num(t.steuer)||0);                          // Steuer nur bei TR (immer EUR)
    }
    for(const d of (p.div||[])) if(String(d.datum||"").slice(0,4)===y) divs+=(num(d.netto)||0)*fxVon(d,rate);
    real+=(+((p.archiv||{})[y])||0);                       // verdichtete frühere Phasen (immer TR/EUR)
    divs+=(+((p.archivDiv||{})[y])||0);                    // verdichtete Dividenden (immer TR/EUR)
    if(p.cash) continue;                                   // Cash hat keine Kursänderung
    // Wertänderung = unrealisiert am Jahresende − unrealisiert am Vorjahresende.
    // Zusammen mit „realisiert" ergibt das die vollständige Jahresperformance.
    // (Näherung mit dem HEUTIGEN Kurs, nicht dem Jahresend-Kurs — Fremdwährung wird hier noch
    // nicht taggenau geführt, da dafür ein FX-Kurs je Jahreswechsel fehlt. Wirkt sich nur auf
    // die Jahres-Tabelle bei Fremdwährungspositionen aus, nicht auf die Portfolio-Gesamtsumme.)
    const hatteBestand = stateAsOf(p,y+"-12-31").openQty>1e-9 || stateAsOf(p,vor+"-12-31").openQty>1e-9;
    if(!hatteBestand) continue;
    const uEnd=unrealAtYearEnd(p,y), uVor=unrealAtYearEnd(p,vor);
    if(uEnd==null || uVor==null){ fehlt++; continue; }      // Jahresend-Kurs fehlt → ehrlich ausweisen
    wert+=(uEnd-uVor)*rate; mitKurs++;
    // Depotwert dieser Position zum Jahresanfang -> Basis für die Jahres-Prozentzahl.
    // Nutzt denselben Jahresanfangs-Kurs wie uVor -> nur wenn wert zählt, zählt auch die Basis.
    const aVor=stateAsOf(p,vor+"-12-31");
    if(aVor.openQty>1e-9) baseWert += aVor.openQty*((p.yearPx||{})[vor])*rate;
  }
  const gesamt=real+divs+wert;
  const gesamtPct=baseWert>0?gesamt/baseWert*100:NaN;
  return {real,divs,steuer,trades,wert,fehlt,mitKurs,gesamt,baseWert,gesamtPct};
}

/* Suche — bewusst flüchtig (nicht gespeichert, nicht gesynct): ein Filter, den man
   nach dem Schließen der App nicht erklären muss. Trifft Titel, Ticker, Broker, ISIN, Branche. */
let _q="";
function normQ(x){ return String(x||"").toLowerCase().trim(); }
function setQuery(v){ _q=normQ(v); render(); }
function clearQuery(){ _q=""; const i=document.getElementById("q"); if(i)i.value=""; syncBar(); render(); }
function toggleSearch(){

  const an=!bar.classList.contains("q");

  if(an){ i.focus(); }

function matchesQuery(p){
  if(!_q) return true;
  return [p.titel,p.symbol,p.broker,p.isin,p.branche,p.notiz].some(v=>normQ(v).includes(_q));
}
/* Leiste einblenden, sobald der Portfolio-Block weggescrollt ist. Endzustand hängt an
   der Klasse, nicht an einer Animation — bei eingefrorenen Animationen bleibt sie korrekt. */
function syncBar(){

  if(!bar||!tot) return;
  // Der Portfolio-Block ist hinter der Leiste verschwunden → statt des Titels die Zahlen zeigen.

function render(){

    tReal+=(m.realizedEur+m.archivReal);                                     // inkl. frueherer Phasen
    if(p.cash){ tZins+=m.divsEur; if(p.divOff)tZinsOff+=m.divsEur; }         // Zinsen zaehlen zum Cash
    else { tDiv+=(m.divsEur+m.archivDivs); if(p.divOff)tDivOff+=m.divsEur; }
    tSteuer+=m.steuer;
    if(m.isCash){ tCash+=m.curValEur; } else if(m.hasKurs){ tUnreal+=m.unrealEur; tCur+=m.curValEur; }
    tGes+=m.gesamtEur; return m;});
  // NICHT die Kaufsumme aller Buchungen als Basis (wie bei der einzelnen Position) — bei wiederbespielten
  // Positionen (Rebuys, Sparplan, reinvestierte Erlöse) zählt dasselbe Kapital dort mehrfach mit und
  // verwässert die Quote über Jahre hinweg. Stattdessen: eingesetztes Kapital = Depotwert − Gesamt.
  const tKapital=tCur+tCash-tGes;
  const tGesPct=tKapital>0?tGes/tKapital*100:NaN;
  _depotWert=tCur+tCash;   // Bezugsgröße für den Prozentanteil je Position
  const hasSym=metrics.some((m,i)=>(state.positions[i].symbol||"").trim()&&m.openQty>0);

    <div class="row"><b style="font-size:14px">Portfolio</b>${(()=>{

        return `<div class="yearseg"><button class="${jy===""?"on":""}" onclick="setJahr('')">Gesamt</button>`+

      })()}

      <div class="spacer"></div>
      ${syncReady()?`<button class="btn ghost" style="padding:5px 10px" onclick="fullSync(true)">⇅ Sync</button>`:""}
      ${hasSym?`<button id="refreshBtn" class="btn ghost" style="padding:5px 10px" onclick="refreshPrices()">⟳ Kurse</button>`:""}
</div>
    ${(()=>{                                   // Bestand zuerst: was ist das Depot wert, und wie viel liegt still?
      const wert=tCur+tCash; if(!(wert>0)) return "";

      <div class="splitlab"><span><i class="dot inv"></i>Investiert <b>${feur(tCur)}</b></span>

      if(!jy) return `<div class="kpis">

      <div class="kpi"><div class="k">Unrealisiert</div><div class="v ${cls(tUnreal)}">${signEur(tUnreal)}</div></div>
      <div class="kpi"><div class="k">Gesamt</div><div class="v ${cls(tGes)}">${signEur(tGes)}</div>${isNaN(tGesPct)?"":`<div class="v2">${fpct(tGesPct)}</div>`}</div>
    </div>`;

    </div>
    <div class="hint" style="margin-top:6px">${y.trades} abgeschlossene Trade(s) · Dividenden ${feur(y.divs)} · Steuer ${feur(y.steuer)}${
      y.fehlt?` · <span class="red">${y.fehlt} Position(en) ohne Jahresend-Kurs</span> — die Wertänderung ist dort noch nicht drin (Kurse werden ab jetzt je Jahr festgehalten).`:""}</div>`;
    })()}

    <div class="fusszeile">
    ${(tDiv||tZins||tSteuer)?`<div class="totchips">
      ${tDiv?(()=>{
        const aus=state.settings.divGlobalOff;

        return `<button class="divchip ${aus?"off":""}" onclick="toggleDivGlobal()" title="Dividenden in Gesamt einrechnen"><span class="cbox">${aus?"":"✓"}</span><span class="chiptxt">Dividenden <span class="amt green">+${emoney(aus?tDiv:zaehlt).replace("+","")}</span>${(!aus&&tDivOff)?` <span class="sub">von ${feur(tDiv)}</span>`:""}</span></button>`;})():""}

      ${tSteuer?(()=>{

        // „Steuer" mit + statt mit dem fest verdrahteten Minus.
        const erstattung=tSteuer<0;
        return `<button class="divchip ${state.settings.steuerGlobalOn?"":"off"}" onclick="toggleSteuerGlobal()" title="Bereits einbehaltene Steuer (v. a. Trade Republic) abziehen, TR-Steueroptimierung netto eingerechnet — IBKR fehlt darin"><span class="cbox">${state.settings.steuerGlobalOn?"✓":""}</span><span class="chiptxt">Steuer <span class="amt ${erstattung?"green":"red"}">${erstattung?"+":"−"}${emoney(Math.abs(tSteuer))}</span></span></button>`;})():""}
    </div>`:""}
      <div class="spacer"></div>
      <span class="fussmeta">${hasSym&&upd?`Kurse ${new Date(upd).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`:""}
        <span class="badge" title="Aktuell gehaltene Wertpapiere (ohne geschlossene und ohne Cash)">${
        metrics.filter((m,i)=>!state.positions[i].cash && m.openQty>1e-9).length} gehalten</span></span>
    </div>`;

  // Offene vs. geschlossene Positionen trennen (geschlossen = alles verkauft, aber es gab Buchungen)
  const openIdx=[], closedIdx=[];
  state.positions.forEach((p,idx)=>{
    if(!matchesQuery(p)) return;                     // Suche filtert die Liste, nicht die Summen
    const mm=metrics[idx];
    // Ein Wertpapier ohne Bestand ist geschlossen — auch wenn davon nur noch Dividenden
    // uebrig sind (z. B. eine Wahldividende ohne eigene Buchungen). Cash bleibt immer oben.
    const hatVergangenheit = mm.tx.length>0 || (p.div||[]).length>0 || mm.archivReal || mm.archivDivs;
    (!p.cash && mm.openQty<=1e-9 && hatVergangenheit ? closedIdx : openIdx).push(idx);

  list.innerHTML="";

  [...openIdx].sort((a,b)=>{const ka=keyOf(a),kb=keyOf(b);return ka<kb?-1:ka>kb?1:0;})
    .forEach(idx=>list.appendChild(renderPos(state.positions[idx],metrics[idx],idx)));
  // Geschlossene in einklappbaren Bereich unten
  if(closedIdx.length){
    const sec=document.createElement("details");

    sum.textContent="Geschlossene Positionen ("+closedIdx.length+")";

    // Erst auf Klick zeichnen: bei voller Historie sind das mehrere hundert Karten,

    const fuellen=()=>{ if(sec.dataset.gefuellt) return;

      sec.dataset.gefuellt="1"; };

  }
  if(_q && !openIdx.length && !closedIdx.length){
    list.innerHTML='<div class="empty-all">Nichts gefunden für „'+esc(_q)+'".<br>Gesucht wird in Titel, Ticker, Broker, ISIN, Branche und Notiz.</div>';
  } else if(_q){
    const t=document.createElement("div"); t.className="hint"; t.style.margin="10px 3px 0";
    t.textContent=(openIdx.length+closedIdx.length)+" von "+state.positions.length+" Positionen — die Zahlen oben gelten weiter fürs ganze Depot.";
    list.appendChild(t);
  }
  // Werte der fixierten Leiste nachziehen (Leiste selbst wird NICHT neu gebaut → Fokus bleibt)
  const jy0=state.settings.jahr||"";
  _dispCur="EUR";   // Summen sind immer in Euro — sonst erbt die Leiste die Waehrung der zuletzt gezeichneten Karte
  const _ys=jy0?yearStats(jy0):null;
  const _f=_schmal()?signEurKurz:signEur;
  const setv=(id,val,klass)=>{const e=document.getElementById(id); if(e){e.textContent=_f(val); e.className="v "+cls(klass===undefined?val:klass);}};
  if(document.getElementById("sk_r")){

    const lbls=document.querySelectorAll("#sticky .skpi .k");
    if(lbls.length===3){ lbls[0].textContent=jy0?"Real. "+jy0:"Realisiert"; lbls[1].textContent=jy0?"Wertänd.":"Unreal."; lbls[2].textContent=jy0?"Gesamt "+jy0:"Gesamt"; }
  }
  syncBar();
  scheduleClamp();
}

// Doppel-rAF: erst nach dem finalen Layout messen (sonst greift der Klemm-Schritt zu früh); zusätzlich nach Font-Load.
function scheduleClamp(){
  requestAnimationFrame(()=>requestAnimationFrame(clampBarLabels));
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(clampBarLabels));
}
// Labels sitzen mittig überm Marker; hier nur bei Überlauf minimal in die Leiste schieben.
function clampBarLabels(){
  const clampInto=(l,br)=>{ const lr=l.getBoundingClientRect(); let dx=0;
    if(lr.left<br.left) dx=br.left-lr.left; else if(lr.right>br.right) dx=br.right-lr.right;
    if(dx) l.style.marginLeft=Math.round((parseFloat(l.style.marginLeft)||0)+dx)+"px"; };
  document.querySelectorAll(".esb").forEach(bar=>{
    if(!bar.clientWidth)return;                    // eingeklappt/versteckt → überspringen
    const br=bar.getBoundingClientRect();
    bar.querySelectorAll(".esb-lab,.esb-pct").forEach(l=>{ l.style.marginLeft="0px"; clampInto(l,br); });
    // Zwei getrennte obere Labels (Einstieg/jetzt): berühren sie sich, als Block um die Marker-Mitte neu setzen.
    const tops=[...bar.querySelectorAll(".esb-lab.top")];
    if(tops.length===2){
      let [L,R]=tops; let a=L.getBoundingClientRect(), b=R.getBoundingClientRect();
      if(a.left>b.left){ [L,R]=[R,L]; [a,b]=[b,a]; }
      const gap=10;
      if(a.right+gap>b.left){                        // Überlappung
        const gw=a.width+gap+b.width;                // Breite des Label-Blocks
        let gL=(a.left+a.width/2 + b.left+b.width/2)/2 - gw/2;   // zentriert auf die Marker-Mitte
        gL=Math.max(br.left, Math.min(gL, br.right-gw));         // in die Leiste klemmen
        const setL=(el,rect,target)=>{ el.style.marginLeft=Math.round((parseFloat(el.style.marginLeft)||0)+(target-rect.left))+"px"; };
        setL(L,a,gL); setL(R,b,gL+a.width+gap);
      }
    }
  });
}

function kpiBlock(m){
  const gp=isNaN(m.gesamtPct)?"":`<div class="v2">${fpct(m.gesamtPct)}</div>`;
  return `<div class="kpis">

    <div class="kpi"><div class="k">Unrealisiert</div>
      <div class="v ${cls(m.unreal)}">${m.hasKurs?signEur(m.unreal):"–"}</div>
      ${m.hasKurs&&!isNaN(m.unrealPct)?`<div class="v2">${fpct(m.unrealPct)}</div>`:""}</div>
    <div class="kpi"><div class="k">Gesamt</div><div class="v ${cls(m.gesamt)}">${signEur(m.gesamt)}</div>${gp}</div>
  </div>`;
}

function esBar(m){
  const E=m.erstEinstieg, B=m.breakEven, N=m.hasKurs?m.kurs:NaN;
  // Auto-Fit nach Wert (kleinster Wert links, größter rechts) MIT Mindest-Spanne:
  // normale Spannen füllen die Leiste; nur winzige %-Abstände clustern in der Mitte (kein Voll-Zoom auf 0,6%).
  const vals=[E,B]; if(!isNaN(N))vals.push(N);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const mid=(lo+hi)/2||1, minSpan=mid*0.10;                 // < ~10% Spanne → nicht auf volle Breite ziehen
  if(hi-lo<minSpan){ lo=mid-minSpan/2; hi=mid+minSpan/2; }
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  const P=v=>Math.max(2,Math.min(98,(v-lo)/(hi-lo)*100));
  const up=!isNaN(N)&&N>=B;
  const pE=P(E),pB=P(B),pN=isNaN(N)?null:P(N);
  let fill="";
  if(pN!=null){const a=Math.min(pB,pN),b=Math.max(pB,pN);
    fill=`<div class="esb-fill ${up?"up":"down"}" style="left:${a}%;width:${b-a}%"></div>`;}
  // Labels farbcodiert wie die Marker: Einstieg grau (umrandeter Punkt), jetzt weiß (voller Punkt) → Wort „jetzt" entfällt.
  // Alle mittig über ihrem Marker; clampBarLabels() korrigiert nach dem Render Randüberlauf/Überschneidung.
  // Am linken/rechten Rand buendig setzen statt mittig — sonst wird die Beschriftung abgeschnitten.
  const anker=(pp)=> pp<14 ? `left:0;transform:none` : pp>86 ? `right:0;left:auto;transform:none` : `left:${pp}%;transform:translateX(-50%)`;
  const eLab=p=>`<div class="esb-lab top e" style="${anker(p)}"><span class="n">Einstieg</span> <span class="v">${feur(E)}</span></div>`;
  const jLab=p=>`<div class="esb-lab top j" style="${anker(p)}"><span class="v">${feur(N)}</span></div>`;
  let topLabs;
  if(pN==null){ topLabs=eLab(pE); }
  else if(Math.abs(pN-pE)<30){
    // Symbole dürfen überlappen – Einstieg (grau) und aktueller Kurs (weiß) nebeneinander, zentriert auf die Marker-Mitte
    const mid=(pE+pN)/2;
    topLabs=`<div class="esb-lab top pair" style="${anker(mid)}"><span class="pl e"><span class="n">Einstieg</span> <span class="v">${feur(E)}</span></span><span class="pl j"><span class="v">${feur(N)}</span></span></div>`;
  }
  else { topLabs=eLab(pE)+jLab(pN); }
  const beLab=`<div class="esb-lab bot be" style="${anker(pB)}"><span class="n">Break-even</span> <span class="v">${feur(B)}</span></div>`;
  // %-Abstand des aktuellen Kurses zum Break-even – macht die Größenordnung sichtbar (auto-gezoomte Leiste zeigt sie sonst nicht)
  let pctLab="";
  if(pN!=null && B){
    const d=(N/B-1)*100;
    const txt=(up?"+":"−")+Math.abs(d).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";
    pctLab=`<div class="esb-pct ${up?"up":"down"}" style="left:${(pB+pN)/2}%">${txt}</div>`;
  }
  return `<div class="esb">
    <div class="esb-trk"></div>${fill}
    <div class="esb-mk e" style="left:${pE}%"><div class="d"></div></div>
    ${pN!=null?`<div class="esb-mk j" style="left:${pN}%"><div class="d"></div></div>`:""}
    <div class="esb-mk b" style="left:${pB}%"><div class="l"></div></div>
    ${pctLab}${topLabs}${beLab}
  </div>`;
}
// Tagestrend (global %/€) und Gesamt (global €/%) – beide antippbar
function dayHtml(p,m){

  const up=pc>=0, ar=up?"▲":"▼";
  const txt=ar+" "+(state.settings.dayMode==="eur"? emoney(Math.abs(abs)) : pct.format(Math.abs(pc))+" %");
  return `<div class="ph-day ${up?"up":"down"}" onclick="toggleDayMode(event)">${txt}</div>`;
}

function renderPos(p,m,idx){
  _dispCur=(p.currency||"EUR").toUpperCase();   // diese Karte in Positions-Währung anzeigen
  const el=document.createElement("div");
  const stopVal=num(p.stop);
  const belowStop=m.hasKurs && stopVal>0 && m.kurs<stopVal;   // Kurs unter Stop

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- Kurs schnell setzen ---------- */
/* Beim Umschalten aendert sich die Hoehe weiter oben (Chip-Zeile bricht um) — ohne Anker
   rutscht der ganze Inhalt weg. Wir merken uns die Lage der angeklickten Karte und
   schieben danach exakt um die Differenz zurueck. */
function renderStable(pid){
  const vor = pid && document.querySelector(`.pos[data-pos="${CSS.escape(pid)}"]`);
  const oben = vor ? vor.getBoundingClientRect().top : null;
  render();
  if(oben!=null){
    const nach = document.querySelector(`.pos[data-pos="${CSS.escape(pid)}"]`);
    if(nach){ const d=nach.getBoundingClientRect().top-oben; if(Math.abs(d)>0.5) window.scrollBy(0,d); }
  }
}
function toggleDivOff(pid){const p=find(pid);if(!p)return;p.divOff=!p.divOff;touch(p);save();renderStable(pid);syncPushLater();}
function ersteSichtbareKarte(){
  for(const el of document.querySelectorAll(".pos[data-pos]")) if(el.getBoundingClientRect().bottom>0) return el.dataset.pos;
  return null;
}
function toggleDivGlobal(){state.settings.divGlobalOff=!state.settings.divGlobalOff;state.settings.divGlobalAt=Date.now();save();renderStable(ersteSichtbareKarte());syncPushLater();}
function toggleZinsGlobal(){state.settings.zinsGlobalOff=!state.settings.zinsGlobalOff;state.settings.zinsGlobalAt=Date.now();save();renderStable(ersteSichtbareKarte());syncPushLater();}
function toggleSteuerGlobal(){state.settings.steuerGlobalOn=!state.settings.steuerGlobalOn;state.settings.steuerGlobalAt=Date.now();save();renderStable(ersteSichtbareKarte());syncPushLater();}
function toggleSteuer(pid){const p=find(pid);if(!p)return;p.steuerOn=!p.steuerOn;touch(p);save();renderStable(pid);syncPushLater();}
function find(pid){return state.positions.find(p=>p.id===pid);}

/* ---------- Live-Kurse (Twelve Data, CORS-offen, Gratis-Key) ---------- */
const DAILY_CAP=800, RESERVE=5, AUTO_THROTTLE_MS=60000;
let priceBusy=false;
function usageToday(){

function addUsage(n){

function openSymbols(){

    .filter(p=>compute(p).openQty>0 && (p.symbol||"").trim())

// Wechselkurs CUR→EUR (kostenlos, ohne Key): Frankfurter/ECB, Fallback open.er-api
async function fxToEur(cur){
  if(!cur || cur==="EUR") return 1;
  try{ const j=await (await fetch("https://api.frankfurter.dev/v1/latest?base="+encodeURIComponent(cur)+"&symbols=EUR",{cache:"no-store"})).json();
    if(j&&j.rates&&j.rates.EUR>0) return j.rates.EUR; }catch(e){}
  try{ const j=await (await fetch("https://open.er-api.com/v6/latest/"+encodeURIComponent(cur),{cache:"no-store"})).json();
    if(j&&j.rates&&j.rates.EUR>0) return j.rates.EUR; }catch(e){}
  return null;
}
// ---- Live-Kurse: Yahoo Finance über CORS-Proxy (kein Key; deckt US + Xetra/EU) ----
// Yahoo blockt direkte Browser-Aufrufe (CORS) → über Proxy. Gratis-Proxys sterben regelmäßig / laufen ins
// Yahoo-Rate-Limit → mehrere als Fallback. Für DAUERHAFT stabil einen eigenen Cloudflare-Worker als ersten
// Eintrag setzen (settings.proxy, {u}=Ziel-URL). corsproxy.io + allorigins/get sind tot (2026-07) → raus.
const PROXIES=[
  {name:"allorigins",  mk:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u), wrap:false},
  {name:"codetabs",    mk:u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u), wrap:false},
  {name:"thingproxy",  mk:u=>"https://thingproxy.freeboard.io/fetch/"+u, wrap:false}
];
// Eigener Proxy (z.B. Cloudflare-Worker) hat Vorrang, wenn in den Einstellungen hinterlegt.
// Tolerant: akzeptiert "…/?url={u}", "…/?url=" oder nur die Worker-Basis-URL.
function proxyMaker(raw){
  if(raw.includes("{u}"))     return u=>raw.replace("{u}",encodeURIComponent(u));
  if(/[?&]url=$/.test(raw))   return u=>raw+encodeURIComponent(u);
  return u=>raw+(raw.includes("?")?"&":"?")+"url="+encodeURIComponent(u);
}
function proxyChain(){
  const raw=((state.settings&&state.settings.proxy)||"").trim();
  if(!raw) return PROXIES;
  return [{name:"eigener Proxy", mk:proxyMaker(raw), wrap:false}, ...PROXIES];
}
// Fehlertext der Gegenstelle mitnehmen — zeigt z.B. Yahoos „Too Many Requests" statt nur „HTTP 429".
function snip(t){ const s=(t||"").replace(/\s+/g," ").trim(); return s?" ("+s.slice(0,70)+")":""; }
async function proxyErrTxt(r){ try{ return snip(await r.text()); }catch(e){ return ""; } }
const DEAD_MSG="nicht mehr bei Yahoo (ausgelaufen/KO)";
// Yahoo meldet ausgelaufene Papiere eindeutig — dann bringt auch kein anderer Proxy etwas.
function yahooDead(t){
  try{ const e=(JSON.parse(t)||{}).chart?.error;
    if(e && (e.code==="Not Found" || /delist|no data|not found/i.test(e.description||""))) return true;
  }catch(e){}
  return false;
}
const deadErr=()=>Object.assign(new Error(DEAD_MSG),{dead:true});
async function proxyJSON(url){
  const errs=[];
  for(const p of proxyChain()){
    let r;
    // Zeitlimit je Proxy: ein hängender Gratis-Proxy blockierte sonst die ganze Kette
    // (Abruf lief minutenlang ins Leere, statt den nächsten zu probieren).
    const ac=("AbortController" in window)?new AbortController():null;
    const tmr=ac?setTimeout(()=>ac.abort(),12000):null;
    try{ r=await fetch(p.mk(url),{cache:"no-store",signal:ac?ac.signal:undefined}); }
    catch(e){ errs.push(p.name+": "+(e.name==="AbortError"?"Zeitüberschreitung":e.name==="TypeError"?"nicht erreichbar":(e.name||"Fehler"))); continue; }
    finally{ if(tmr)clearTimeout(tmr); }
    if(!r.ok){
      const t=await r.text().catch(()=>"");
      if(yahooDead(t)) throw deadErr();          // klare Absage → Kette abbrechen statt 4× dasselbe zu fragen
      errs.push(p.name+": HTTP "+r.status+snip(t)); continue;
    }
    try{
      if(p.wrap){ const w=await r.json(); return JSON.parse(w.contents); }
      return await r.json();
    }catch(e){ errs.push(p.name+": Antwort unlesbar"); }
  }
  const err=new Error(errs.join(" · ")||"Proxy nicht erreichbar");
  err.proxy=true;   // kein Ticker-Problem, sondern die Leitung → in der Meldung getrennt anzeigen
  throw err;
}
// Yahoo sperrt query1/query2 zeitweise einzeln → bei Fehlschlag den anderen Host nehmen und ihn sich merken.
let yhHost="query1";
async function yahooJSON(path){
  try{ return await proxyJSON("https://"+yhHost+".finance.yahoo.com"+path); }
  catch(e){
    if(e&&e.dead) throw e;                       // Papier gibt es nicht mehr → der andere Host sagt dasselbe
    const alt=yhHost==="query1"?"query2":"query1";
    const b=await proxyJSON("https://"+alt+".finance.yahoo.com"+path);
    yhHost=alt; return b;
  }
}
async function yahooQuote(sym){
  const b=await yahooJSON("/v8/finance/chart/"+encodeURIComponent(sym)+"?range=1d&interval=1d");
  if(b&&b.chart&&b.chart.error) throw deadErr();   // manche Proxys reichen die Absage mit Status 200 durch
  const m=b&&b.chart&&b.chart.result&&b.chart.result[0]&&b.chart.result[0].meta;
  if(!m || m.regularMarketPrice==null) throw new Error("kein Kurs (Ticker prüfen)");
  return {price:+m.regularMarketPrice, cur:m.currency||"EUR", time:(m.regularMarketTime?m.regularMarketTime*1000:0),
    prev:(m.chartPreviousClose!=null?m.chartPreviousClose:(m.previousClose!=null?m.previousClose:null))};
}

/* Sammel-Abruf: EIN Aufruf für viele Ticker statt einer pro Ticker — der Gratis-Proxy
   bricht bei ~50 Einzelabrufen hinten weg (Positionen ohne Kurs). „spark" liefert aber
   keine Währung, deshalb merken wir sie uns je Ticker (gelernt aus dem Einzel-Abruf). */
function symCurMap(){ return state.settings.symCur||(state.settings.symCur={}); }
function seedSymCur(){                     // aus vorhandenen Kursen lernen, damit der erste Lauf schon bündelt
  const m=symCurMap();
  for(const p of state.positions){
    const s=(p.symbol||"").trim(); if(!s||m[s])continue;
    if(p.kursAktuell) m[s]=((p.fxFrom||"").toUpperCase())||((p.currency||"EUR").toUpperCase());
  }
}
async function yahooSpark(syms){
  const b=await yahooJSON("/v8/finance/spark?symbols="+syms.map(encodeURIComponent).join(",")+"&range=1d&interval=1d");
  const out={};
  for(const s of syms){
    const d=b&&b[s]; if(!d)continue;
    const cl=(d.close||[]).filter(x=>x!=null);
    if(!cl.length)continue;
    const ts=d.timestamp||[];
    out[s]={price:+cl[cl.length-1], prev:(d.chartPreviousClose!=null?+d.chartPreviousClose:null),
            time:(ts.length?ts[ts.length-1]*1000:0)};
  }
  return out;
}
// Zeigt, VON WANN der Kurs ist (Börsen-Zeitstempel) — heute = evtl. live (~15 Min verzögert), sonst Schlusskurs.
function kursTimeLbl(ms){
  if(!ms) return "";
  const d=new Date(ms), now=new Date();
  const hm=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===now.toDateString()) return "Stand heute "+hm;
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "Stand gestern "+hm;
  const wd=["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()];
  return "Stand "+wd+" "+d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+hm;
}
async function refreshPrices(auto){
  if(priceBusy)return;
  const syms=openSymbols();
  if(!syms.length){ if(!auto)alert("Keine Position mit Yahoo-Ticker. Ticker im Positions-Editor eintragen (🔍)."); return; }
  if(auto && state.settings.pricesUpdated && Date.now()-state.settings.pricesUpdated < AUTO_THROTTLE_MS)return; // Kurz-Sperre gegen schnelles Neuladen
  priceBusy=true;
  const btn=document.getElementById("refreshBtn"); if(btn)btn.textContent="⟳ lädt…";
  try{
    // Pro Symbol EINZELN → ein kaputter Ticker blockiert die anderen nicht.
    const quotes={}; const dead={}; const fail=[]; let diag="";   // diag = eine Proxy-Meldung im Klartext, nicht pro Ticker wiederholt
    seedSymCur(); const symCur=symCurMap();
    // 1) Gebündelt: alles mit bekannter Währung in wenigen Aufrufen (statt einer je Ticker)
    const nachzuegler=[];
    const known=syms.filter(s=>symCur[s]);
    for(let i=0;i<known.length;i+=30){
      const teil=known.slice(i,i+30);
      try{
        const sp=await yahooSpark(teil);
        for(const s of teil){ if(sp[s]) quotes[s]=Object.assign({cur:symCur[s]}, sp[s]); else nachzuegler.push(s); }
      }catch(e){ nachzuegler.push(...teil); }                  // Bündel-Abruf hakt → einzeln nachholen
      if(i+30<known.length) await sleep(200);
    }
    // 2) Einzeln: unbekannte Währung (einmalig, wird gemerkt) + Nachzügler
    const rest=[...new Set(syms.filter(s=>!symCur[s]).concat(nachzuegler))];
    const CHUNK=4;   // wenige parallel → schont den Gratis-Proxy (zu viele auf einmal → TypeError)
    for(let i=0;i<rest.length;i+=CHUNK){
      await Promise.all(rest.slice(i,i+CHUNK).map(async sym=>{
        for(let a=0;a<3;a++){                                  // bis zu 3 Versuche (Proxy zickt gern kurz)
          try{ const q=await yahooQuote(sym); quotes[sym]=q; symCur[sym]=(q.cur||"EUR").toUpperCase(); return; }
          catch(e){
            if(e&&e.dead){ dead[sym]=1; fail.push(sym+" — "+e.message); return; }   // Wiederholen sinnlos
            if(a<2){ await sleep(400); continue; }
            if(e&&e.proxy){ diag=diag||e.message; fail.push(sym+" — Abruf blockiert"); }
            else fail.push(sym+" — "+(e.message||"kein Kurs")); }
        }
      }));
      if(i+CHUNK<rest.length) await sleep(200);                // kleine Pause zwischen den Bündeln
    }
    for(const s of syms) if(!quotes[s] && !dead[s] && !fail.some(f=>f.indexOf(s+" —")===0)) fail.push(s+" — kein Kurs (Ticker prüfen)");
    // Fremdwährungen → EUR (je Währung einmal, kostenlos ohne Key)
    const posCurs=state.positions.map(p=>(p.currency||"EUR").toUpperCase()).filter(c=>c&&c!=="EUR");
    const curs=[...new Set(Object.values(quotes).map(q=>q.cur).filter(c=>c&&c!=="EUR").concat(posCurs))];
    const fx={};
    for(const c of curs){ const r=await fxToEur(c); if(r) fx[c]=r; }
    if(Object.keys(fx).length){ state.settings.fxRates=Object.assign({}, state.settings.fxRates||{}, fx); }  // für Portfolio-Summe in EUR
    let ok=0;
    for(const p of state.positions){
      const s=(p.symbol||"").trim();
      if(!s || compute(p).openQty<=0)continue;
      if(dead[s]){ if(!p.kursDead){ p.kursDead=Date.now(); touch(p); } continue; }   // ausgelaufen → sichtbar markieren
      const q=quotes[s]; if(!q)continue;
      if(p.kursDead){ delete p.kursDead; touch(p); }                                 // liefert wieder → Marke weg
      const pcur=(p.currency||"EUR").toUpperCase();
      const toEur=c=> c==="EUR"?1:fx[c];   // EUR je 1 c
      let val=q.price, pv=(q.prev!=null?q.prev:null), from="";
      if(q.cur && q.cur!==pcur){   // Fremdwährung des Kurses ≠ Anzeige-Währung der Position → umrechnen
        if(toEur(q.cur)===undefined || toEur(pcur)===undefined){ const msg=s+" — Umrechnung ("+q.cur+"→"+pcur+") nicht verfügbar"; if(!fail.includes(msg))fail.push(msg); continue; }
        const f=toEur(q.cur)/toEur(pcur); val=q.price*f; if(pv!=null)pv*=f; from=(pcur==="EUR"?q.cur:"");
      }
      p.kursAktuell=(+(val.toFixed(val<10?4:2))+"").replace(".",","); p.fxFrom=from; p.kursTime=q.time||Date.now(); p.prevClose=(pv!=null?+pv.toFixed(4):null);
      // Kurs unter dem laufenden Jahr ablegen: der letzte Abruf eines Jahres ist damit
      // automatisch der Jahresend-Kurs — Grundlage für die Wertänderung je Jahr.
      (p.yearPx||(p.yearPx={}))[String(new Date().getFullYear())]=+val.toFixed(6);
      ok++;
    }
    state.settings.pricesUpdated=Date.now();
    save(); render();
    if(auto){ if(ok)toast("✓ Kurse aktualisiert"); }
    else if(fail.length)alert(ok+" Kurs(e) aktualisiert.\n\nKein Kurs für:\n• "+fail.join("\n• ")+
      (Object.keys(dead).length?"\n\nAusgelaufen → zählt ab jetzt mit 0 €.":"")+
      (diag?"\n\nProxy: "+diag:"\n\nTicker prüfen (🔍 im Editor), z.B. SAP.DE · AAPL."));
    else toast("✓ "+ok+" Kurse aktualisiert");
  }catch(e){
    if(!auto)alert("Abruf fehlgeschlagen — offline oder Proxy tot.");
  }finally{
    priceBusy=false;
    const b=document.getElementById("refreshBtn"); if(b)b.textContent="⟳ Kurse";
  }
}

/* ---------- GitHub-Sync (privates Repo, nur Positionen; Keys bleiben lokal) ---------- */
let syncBusy=false, pushTimer=null;
function ghCfg(){const g=state.settings.gh||{};return {token:(g.token||"").trim(),repo:(g.repo||"").trim(),
  path:(g.path||"trading.json").trim(),branch:(g.branch||"main").trim()};}
function syncReady(){const c=ghCfg();return !!(c.token&&c.repo&&c.path);}
function b64encode(str){ // in Blöcken kodieren, sonst sprengt fromCharCode.apply bei großen Daten den Call-Stack (v.a. mobil)
  const bytes=new TextEncoder().encode(str); let bin=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64decode(b64){return new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)));}
function u(o){return (o&&o._u)||0;}

// Gesynct werden Positionen + Tombstones + der Zuklapp-Zustand (KEINE Token/Keys)
function syncPayload(){return {positions:state.positions, tombstones:state.tombstones||{},
  collapsed:state.settings.collapsed||{}, collapsedAt:state.settings.collapsedAt||0,
  divGlobalOff:!!state.settings.divGlobalOff, divGlobalAt:state.settings.divGlobalAt||0,
  steuerGlobalOn:!!state.settings.steuerGlobalOn, steuerGlobalAt:state.settings.steuerGlobalAt||0,
  zinsGlobalOff:!!state.settings.zinsGlobalOff, zinsGlobalAt:state.settings.zinsGlobalAt||0, syncedAt:Date.now()};}

// Zwei Listen (tx bzw. div) nach id + Änderungszeit + Tombstones zusammenführen
function mergeList(a,b,tomb){
  const map={};
  for(const it of (a||[]).concat(b||[])){
    if(!it||!it.id)continue;
    if(!map[it.id] || u(it)>=u(map[it.id])) map[it.id]=it;
  }
  let liste=Object.values(map).filter(it=>!(tomb[it.id] && tomb[it.id]>=u(it)));
  // Sicherheitsnetz: dieselbe Buchung mit ZWEI Kennungen (passiert, wenn Daten von aussen
  // neu aufgebaut werden und dabei neue Kennungen bekommen). Die Broker-Nummer (trid) ist
  // eindeutig — bei Gleichstand gewinnt die kleinere Kennung, damit alle Geräte gleich wählen.
  const proTrid={};
  for(const it of liste){
    if(!it.trid) continue;
    const da=proTrid[it.trid];
    if(!da || String(it.id)<String(da.id)) proTrid[it.trid]=it;
  }
  return liste.filter(it=>!it.trid || proTrid[it.trid]===it);
}
// Gesamt-Merge zweier Zustände
function mergeStates(local,remote){
  const tomb={};
  for(const src of [local.tombstones||{}, remote.tombstones||{}])
    for(const id in src) tomb[id]=Math.max(tomb[id]||0, src[id]||0);
  const byId={};
  for(const p of (local.positions||[]).concat(remote.positions||[])){
    if(!p||!p.id)continue;
    if(!byId[p.id]) byId[p.id]={L:null,R:null};
  }
  const lmap={},rmap={};
  (local.positions||[]).forEach(p=>p&&p.id&&(lmap[p.id]=p));
  (remote.positions||[]).forEach(p=>p&&p.id&&(rmap[p.id]=p));
  const positions=[];
  for(const id in byId){
    const L=lmap[id], R=rmap[id];
    const base = (!R || u(L)>=u(R)) ? L : R;   // Skalarfelder: neuere Position gewinnt
    if(!base) continue;
    const merged={...base};
    merged.tx  = mergeList(L&&L.tx,  R&&R.tx,  tomb);
    merged.div = mergeList(L&&L.div, R&&R.div, tomb);
    merged.taxOpt = mergeList(L&&L.taxOpt, R&&R.taxOpt, tomb);
    // Position gelöscht? (Tombstone neuer als letzte Änderung UND keine überlebenden Buchungen erzwingen Behalt)
    if(tomb[id] && tomb[id]>=u(base)) continue;
    positions.push(merged);
  }
  // Zuklapp-Zustand: die zuletzt geänderte Ansicht gewinnt (Last-Writer-Wins per Zeitstempel)
  const lAt=local.collapsedAt||0, rAt=remote.collapsedAt||0;
  const collapsed = rAt>lAt ? (remote.collapsed||{}) : (local.collapsed||{});
  const dAt=Math.max(local.divGlobalAt||0, remote.divGlobalAt||0);
  const divGlobalOff = (remote.divGlobalAt||0)>(local.divGlobalAt||0) ? !!remote.divGlobalOff : !!local.divGlobalOff;
  const sAt=Math.max(local.steuerGlobalAt||0, remote.steuerGlobalAt||0);
  const steuerGlobalOn = (remote.steuerGlobalAt||0)>(local.steuerGlobalAt||0) ? !!remote.steuerGlobalOn : !!local.steuerGlobalOn;
  const zAt=Math.max(local.zinsGlobalAt||0, remote.zinsGlobalAt||0);
  const zinsGlobalOff = (remote.zinsGlobalAt||0)>(local.zinsGlobalAt||0) ? !!remote.zinsGlobalOff : !!local.zinsGlobalOff;
  return {positions, tombstones:tomb, collapsed, collapsedAt:Math.max(lAt,rAt), divGlobalOff, divGlobalAt:dAt, steuerGlobalOn, steuerGlobalAt:sAt, zinsGlobalOff, zinsGlobalAt:zAt};
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function ghGet(){
  const c=ghCfg();
  const [owner,repo]=c.repo.split("/");
  // Cache umgehen: eindeutiger Parameter + no-store → GitHub liefert die AKTUELLE sha (nicht die gecachte)
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(c.path)}?ref=${encodeURIComponent(c.branch)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:"no-store",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {data:{positions:[],tombstones:{}}, sha:null};
  if(!r.ok) throw new Error("GET "+r.status+" "+(await r.text()).slice(0,140));
  const j=await r.json();
  // GitHub liefert Dateien über 1 MB OHNE Inhalt aus. Früher lief der Abgleich dann mit einem
  // LEEREN Gegenstand weiter und hat den eigenen Stand darübergeschrieben — dabei gingen die
  // Löschmarken der anderen Geräte verloren. Lieber abbrechen als etwas überschreiben.
  const roh=(j.content||"").replace(/\n/g,"");
  const kb=Math.round((j.size||0)/1024);
  if(!roh) throw new Error("Der Stand im Repo ist "+kb+" KB groß — über der Grenze von 1024 KB, die GitHub ausliefert. Abgleich abgebrochen, damit nichts überschrieben wird.");
  let data;
  try{ data=JSON.parse(b64decode(roh)); }
  catch(e){ throw new Error("Der Stand im Repo ist unlesbar — Abgleich abgebrochen, damit nichts überschrieben wird."); }
  if(kb>900) setSyncStatus("Datei "+kb+" KB — nah an der Grenze");
  return {data, sha:j.sha};
}
async function ghPut(payload, sha){
  const c=ghCfg();
  const [owner,repo]=c.repo.split("/");
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(c.path)}`;
  // kompakt statt eingerueckt: spart bei voller Historie rund ein Drittel (797 -> 534 KB)
  const body={message:"trading sync "+new Date().toISOString(), content:b64encode(JSON.stringify(payload)), branch:c.branch};
  if(sha) body.sha=sha;
  const r=await fetch(url,{method:"PUT",cache:"no-store",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},body:JSON.stringify(body)});
  const txt=await r.text();
  if(!r.ok){ const err=new Error("PUT "+r.status+" "+txt.slice(0,140)); err.status=r.status; throw err; }
  try{ return JSON.parse(txt).content.sha; }catch(e){ return null; }
}

/* ---------- IBKR-Wochenautomatik manuell anstoßen ----------
   Die eigentliche Automatik läuft als GitHub Action im daten-Repo (Flex Web Service,
   samstags). Dieser Button ruft nur workflow_dispatch auf denselben Sync-Zugang —
   IBKR bekommt das Token nie zu Gesicht, das läuft serverseitig in der Action. */
function ibkrLastLbl(){
  const t=state.settings.ibkrTriggeredAt;
  if(!t) return "Noch nicht manuell ausgelöst — läuft sonst nur samstags.";
  return "Zuletzt manuell ausgelöst: "+new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+" Uhr";
}
async function triggerIbkrPull(){
  const c=ghCfg();
  if(!c.token||!c.repo){ alert(`Erst oben unter „Sync über GitHub" Repo + Token eintragen — der IBKR-Anstoß nutzt dieselben Zugangsdaten (Repo daten).`); return; }
  const last=state.settings.ibkrTriggeredAt;
  if(last && Date.now()-last<20*3600*1000){
    const std=((Date.now()-last)/3600000).toFixed(1);
    if(!confirm(`Zuletzt vor ${std} Std. ausgelöst. IBKR drosselt bei zu häufigen Abrufen (Fehler 1001/1025) — trotzdem jetzt erneut anstoßen?`)) return;
  }
  const [owner,repo]=c.repo.split("/");
  const btn=document.getElementById("ibkrBtn"); if(btn){btn.disabled=true;btn.textContent="… wird gestartet";}
  try{
    const url=`https://api.github.com/repos/${owner}/${repo}/actions/workflows/ibkr-weekly.yml/dispatches`;
    const r=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},
      body:JSON.stringify({ref:c.branch})});
    if(r.status===204){
      state.settings.ibkrTriggeredAt=Date.now(); save();
      toast(`✓ IBKR-Abruf gestartet — dauert 1–2 Min, danach „⇅ Sync" zum Nachladen.`);
      openBackup();
    } else if(r.status===403){
      alert(`Kein Zugriff (403). Der Token braucht zusätzlich die Berechtigung „Actions: Read and write" auf dem daten-Repo — im Fine-grained-Token nachtragen (GitHub → Settings → Developer settings → Tokens), sonst neu erstellen.`);
    } else if(r.status===404){
      alert(`Workflow nicht gefunden (404). Prüfen: Repo „${c.repo}", Datei .github/workflows/ibkr-weekly.yml, Branch „${c.branch}".`);
    } else {
      alert("Fehlgeschlagen ("+r.status+"): "+(await proxyErrTxt(r)));
    }
  }catch(e){ alert("Netzwerkfehler: "+(e.message||e)); }
  finally{ if(btn){btn.disabled=false;btn.textContent="⇣ IBKR jetzt ziehen";} }
}

// Vergleicht zwei Sync-Nutzlasten ohne den volatilen Zeitstempel → true, wenn inhaltlich gleich
function _syncUnchanged(a,b){ if(!a||!b) return false; const n=o=>{const x={...o}; delete x.syncedAt; return JSON.stringify(x);}; try{ return n(a)===n(b); }catch(e){ return false; } }
// Voll-Sync: holen → mergen → zurückschreiben; bei sha-Konflikt (409) mit frischer sha erneut versuchen
async function fullSync(manual){
  if(syncBusy || !syncReady()){ if(manual&&!syncReady())alert("Bitte zuerst Repo + Token im Backup-Menü eintragen."); return; }
  syncBusy=true; setSyncStatus("Sync…");
  try{
    let done=false, lastErr=null;
    for(let attempt=0; attempt<5 && !done; attempt++){
      const {data:remote,sha}=await ghGet();     // cache-umgehend → aktuelle sha
      const merged=mergeStates({positions:state.positions,tombstones:state.tombstones,
        collapsed:state.settings.collapsed,collapsedAt:state.settings.collapsedAt,
        divGlobalOff:state.settings.divGlobalOff,divGlobalAt:state.settings.divGlobalAt,
        steuerGlobalOn:state.settings.steuerGlobalOn,steuerGlobalAt:state.settings.steuerGlobalAt,
        zinsGlobalOff:state.settings.zinsGlobalOff,zinsGlobalAt:state.settings.zinsGlobalAt}, remote);
      state.positions=merged.positions; state.tombstones=merged.tombstones;
      state.settings.collapsed=merged.collapsed; state.settings.collapsedAt=merged.collapsedAt;
      state.settings.divGlobalOff=merged.divGlobalOff; state.settings.divGlobalAt=merged.divGlobalAt;
      state.settings.steuerGlobalOn=merged.steuerGlobalOn; state.settings.steuerGlobalAt=merged.steuerGlobalAt;
      state.settings.zinsGlobalOff=merged.zinsGlobalOff; state.settings.zinsGlobalAt=merged.zinsGlobalAt;
      save(); render();
      const pl=syncPayload();
      if(_syncUnchanged(pl, remote)){ done=true; break; }   // nichts geändert → kein Commit (spart Leer-Commits)
      try{ await ghPut(pl, sha); done=true; }
      catch(e){ lastErr=e; if(e.status===409){ await sleep(500); continue; } throw e; } // sha veraltet → neu holen
    }
    if(!done) throw lastErr||new Error("Konflikt nach mehreren Versuchen");
    state.settings.syncedAt=Date.now(); save(); render();
    setSyncStatus("");
    if(manual)toast("✓ Synchronisiert");
  }catch(e){
    setSyncStatus("Sync-Fehler");
    if(manual)alert("Sync fehlgeschlagen:\n"+e.message+"\n\nRepo (owner/repo), Token-Rechte (Contents: Read/Write) und Branch prüfen.");
  }finally{ syncBusy=false; }
}
function syncPushLater(){ // nach Änderungen automatisch (gebündelt) hochladen
  if(!syncReady() || state.settings.autoSync===false) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>fullSync(false), 1500);
}
function setSyncStatus(t){ const e=document.getElementById("syncStatus"); if(e)e.textContent=t; }

function savePos(pid){

  let m;
